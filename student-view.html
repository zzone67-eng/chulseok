body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── 인증 ── */
.auth{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;width:100%;}
.auth.on{display:flex;}
.auth-logo{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.auth-logo span{color:var(--acc);}
.auth-sub{font-size:13px;color:var(--tx3);margin-bottom:40px;}
.auth-card{width:100%;max-width:min(340px, calc(100% - 48px));background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:28px 24px;}
.auth-title{font-size:15px;font-weight:700;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:600;color:var(--tx3);display:block;margin-bottom:6px;letter-spacing:.06em;}
.field input,.field select{width:100%;padding:13px 16px;background:var(--bg);border:1px solid var(--bd2);border-radius:12px;color:var(--tx);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--acc);}
.auth-btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;margin-top:4px;}
.auth-link{background:none;border:none;color:var(--tx3);font-size:13px;cursor:pointer;margin-top:16px;display:block;text-align:center;}
.auth-msg{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none;}
.auth-msg.err{background:#2A1515;color:#E06060;display:block;}

/* ── 앱 ── */
.app{display:none;flex-direction:column;height:100vh;width:100%;background:var(--bg);}
.app.on{display:flex;}

/* 헤더 */
.hdr{flex-shrink:0;padding:16px 20px 12px;display:flex;align-items:center;gap:8px;background:var(--bg);}
.hdr-logo{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.hdr-logo span{color:var(--acc);}
.hdr-sep{width:1px;height:14px;background:var(--bd2);flex-shrink:0;}
.hdr-user{flex:1;font-size:14px;color:var(--tx2);}
.hdr-logout{background:none;border:none;color:var(--tx3);font-size:18px;cursor:pointer;padding:4px;line-height:1;}

/* 탭바 */
.tabbar{flex-shrink:0;display:flex;justify-content:center;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:transparent;}
.tabbar-pill{display:flex;background:var(--sf);border-radius:999px;padding:6px;gap:2px;border:1px solid var(--bd);box-shadow:0 4px 20px rgba(0,0,0,.35);}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;cursor:pointer;padding:8px 14px;border-radius:999px;position:relative;transition:all .2s ease;-webkit-user-select:none;}
.tbtn.on{background:var(--sf2);color:var(--tx);}
.tbtn.on{color:var(--acc);}
.t-icon{font-size:22px;line-height:1;}
.t-badge{position:absolute;top:4px;right:calc(50% - 16px);background:var(--acc);color:#fff;border-radius:999px;font-size:9px;font-weight:700;padding:1px 5px;display:none;}

/* 스크롤 영역 */
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;}
.pane{display:none;}
.pane.on{display:block;}

/* ── 홈 ── */
/* 공지 배너 */
.notice-bar{margin:0 clamp(16px,4vw,32px) 12px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;display:none;}
.notice-bar.show{display:flex;}
.notice-bar:active{background:var(--sf2);}
.nb-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0;}
.nb-txt{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-arr{font-size:14px;color:var(--tx3);}

/* 달력 */
.cal-wrap{margin:0 clamp(16px,4vw,32px) 12px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;overflow:hidden;}
.cal-head{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;}
.cal-title{font-size:16px;font-weight:700;}
.cal-navs{display:flex;gap:4px;}
.cal-nb{background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer;padding:2px 8px;line-height:1;border-radius:8px;}
.cal-nb:active{background:var(--sf2);}
.cal-grid{padding:0 12px 14px;}
.cal-dh{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
.cal-dh span{font-size:10px;font-weight:700;color:var(--tx3);text-align:center;padding:3px 0;letter-spacing:.03em;}
.cal-dh span:first-child{color:var(--red);}
.cal-dh span:last-child{color:var(--blue);}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.cd{min-height:38px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--tx3);gap:2px;}
.cd.has{background:var(--sf2);color:var(--tx);font-weight:700;}
.cd.has.sun{color:var(--red);}
.cd.has.sat{color:var(--blue);}
.cd.today{background:var(--acc)!important;color:#fff!important;font-weight:800;}
.cd.has.today{background:var(--acc)!important;}
.cd-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.5);}
.cd:not(.today) .cd-dot{background:var(--blue);}
.cd.sp-only{background:rgba(200,148,10,.12);color:var(--yellow);}
.cd.sp-only .cd-dot{background:var(--yellow);}

/* 오늘 수업 */
.today-wrap{margin:0 clamp(16px,4vw,32px) 12px;}
.section-label{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;margin-bottom:8px;}
.today-card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;overflow:hidden;}
.today-card.active{border-color:rgba(74,143,212,.35);background:linear-gradient(160deg,#0C1C30 0%,var(--sf) 60%);}
.tc-head{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;}
.tc-indicator{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex-shrink:0;}
.tc-indicator.on{background:var(--blue);box-shadow:0 0 8px rgba(74,143,212,.5);}
.tc-info{flex:1;}
.tc-date{font-size:12px;color:var(--tx2);}
.tc-status{font-size:16px;font-weight:700;margin-top:1px;}
.tc-chips{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;}
.tc-chip{border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;border:1px solid rgba(74,143,212,.2);background:rgba(74,143,212,.08);}
.tc-chip.sp{border-color:rgba(200,148,10,.2);background:rgba(200,148,10,.07);}
.tc-tnum{font-size:13px;font-weight:700;color:var(--blue);}
.tc-chip.sp .tc-tnum{color:var(--yellow);}
.tc-trange{font-size:12px;color:var(--tx2);margin-left:2px;}
.tc-stag{margin-left:auto;font-size:10px;font-weight:700;background:#2A1F08;color:var(--yellow);border-radius:5px;padding:2px 7px;}

/* 다음 수업 */
.next-wrap{margin:0 clamp(16px,4vw,32px) 20px;}
.next-item{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.ni-date-col{text-align:center;min-width:38px;}
.ni-day-num{font-size:20px;font-weight:800;line-height:1.1;}
.ni-day-label{font-size:10px;color:var(--tx3);margin-top:2px;}
.ni-day-label.sun{color:var(--red);}
.ni-day-label.sat{color:var(--blue);}
.ni-sep{width:1px;height:36px;background:var(--bd);}
.ni-times{flex:1;font-size:12px;color:var(--tx2);line-height:1.9;}
.sp-pip{display:inline;background:rgba(200,148,10,.15);color:var(--yellow);font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:3px;}

/* 목표 */
.goal-wrap{margin:0 20px 24px;}
.goal-card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;overflow:hidden;}
.goal-top{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
.goal-ttl{font-size:15px;font-weight:700;}
.goal-edit-btn{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;}
.goal-edit-btn.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.goal-body{padding:0 18px 18px;}
.goal-motto{font-size:18px;font-weight:800;color:var(--tx);line-height:1.3;margin-bottom:4px;}
.goal-motto.empty{font-size:14px;font-weight:400;color:var(--tx3);font-style:italic;}
.goal-desc{font-size:12px;color:var(--tx2);margin-bottom:14px;}
.task-list{display:flex;flex-direction:column;gap:7px;}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--sf2);border-radius:11px;border:1px solid var(--bd);}
.task-cb{width:18px;height:18px;border-radius:5px;border:2px solid var(--bd2);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .15s;}
.task-cb.done{background:var(--green);border-color:var(--green);}
.task-info{flex:1;}
.task-txt{font-size:13px;line-height:1.4;}
.task-txt.done{color:var(--tx3);text-decoration:line-through;}
.task-period{font-size:11px;color:var(--tx3);margin-top:2px;}
.add-task{width:100%;padding:10px;border:1px dashed var(--bd2);border-radius:10px;background:none;color:var(--tx3);font-size:13px;cursor:pointer;margin-top:6px;}

/* 목표 편집 */
.goal-edit-form{padding:0 18px 18px;display:none;flex-direction:column;gap:12px;}
.ef-label{font-size:11px;font-weight:600;color:var(--tx3);display:block;margin-bottom:5px;letter-spacing:.05em;}
.ef-input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:14px;font-family:inherit;outline:none;}
.ef-input:focus{border-color:var(--acc);}
.task-edit-row{display:flex;gap:8px;margin-bottom:8px;}
.task-edit-row input{flex:1;padding:10px 12px;background:var(--bg);border:1px solid var(--bd2);border-radius:9px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;}
.del-btn{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer;padding:6px;}
.save-btn{width:100%;padding:13px;background:var(--acc);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}

/* ── 시간표 탭 ── */
.sch-pad{padding:16px clamp(16px,4vw,32px);}
.stat-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);}
.stat-row:last-child{border:none;}
.stat-lbl{font-size:13px;color:var(--tx2);}
.stat-val{font-size:14px;font-weight:700;}
.sch-sec{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;margin:14px 0 8px;}
.cls-item{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:13px 16px;margin-bottom:8px;}
.cls-date{font-size:13px;font-weight:700;margin-bottom:4px;}
.cls-time{font-size:12px;color:var(--tx2);line-height:1.8;}

/* ── 공지 탭 ── */
.ntc-pad{padding:16px clamp(16px,4vw,32px);}
.filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{display:none;}
.ftab{padding:7px 16px;border-radius:999px;border:1px solid var(--bd);background:none;color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.ftab.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.ntc-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;}
.ntc-card:active{background:var(--sf2);}
.ntc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ntc-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;}
.nb-all{background:rgba(74,143,212,.15);color:var(--blue);}
.nb-cls{background:rgba(200,148,10,.15);color:var(--yellow);}
.nb-hot{background:rgba(201,64,64,.15);color:var(--red);}
.ntc-date{font-size:11px;color:var(--tx3);margin-left:auto;}
.ntc-title{font-size:14px;font-weight:700;margin-bottom:5px;}
.ntc-body{font-size:13px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;}
.ntc-body.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.asgn-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:8px;}
.asgn-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.asgn-ttl{font-size:14px;font-weight:700;}
.asgn-due{font-size:11px;font-weight:700;color:var(--red);}
.asgn-due.past{color:var(--tx3);}
.asgn-body{font-size:13px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;}

/* ── 갤러리 탭 ── */
.gal-pad{padding:16px clamp(16px,4vw,32px);}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px;}
.gal-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sf);cursor:pointer;position:relative;}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block;}
.gal-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:8px 6px 5px;font-size:10px;color:#fff;}

/* ── 상담 탭 ── */
.chat-wrap{display:flex;flex-direction:column;height:100%;}
.chat-msgs{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.bubble-row{display:flex;flex-direction:column;}
.bubble-row.me{align-items:flex-end;}
.bubble-row.them{align-items:flex-start;}
.bubble{max-width:80%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.6;}
.bubble.me{background:var(--acc);color:#fff;border-bottom-right-radius:5px;}
.bubble.them{background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:5px;}
.btime{font-size:10px;color:var(--tx3);margin-top:4px;}
.chat-input{flex-shrink:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--bd);display:flex;gap:10px;align-items:flex-end;}
.chat-ta{flex:1;padding:11px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:44px;max-height:100px;line-height:1.5;}
.chat-ta:focus{border-color:var(--acc);}
.chat-send{background:var(--acc);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;padding:11px 16px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* 라이트박스 */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.lb.on{display:flex;}
.lb img{max-width:100%;max-height:80vh;border-radius:14px;object-fit:contain;}
.lb-x{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:24px;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.lb-cap{color:#bbb;font-size:13px;margin-top:12px;text-align:center;}

/* 대기 */
.pend-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
.empty{color:var(--tx3);font-size:13px;text-align:center;padding:28px 0;}

/* ── 인터랙션 ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,143,212,.5)}60%{box-shadow:0 0 0 10px rgba(74,143,212,0)}}
@keyframes checkPop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.25) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-5px)}60%{transform:translateY(-2px)}100%{transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes ripple{from{transform:scale(0);opacity:.4}to{transform:scale(2.5);opacity:0}}

/* 스켈레톤 */
.skel{background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:12px;}
.skel-h{height:14px;margin-bottom:8px;width:100%;}
.skel-h.w60{width:60%;}
.skel-block{height:90px;border-radius:18px;margin-bottom:12px;}

/* 탭 전환 */
.pane{opacity:0;transform:translateY(6px);pointer-events:none;transition:none;}
.pane.on{opacity:1;transform:translateY(0);pointer-events:auto;animation:fadeUp .3s ease both;}

/* 버튼 눌림 피드백 */
.tbtn{transition:transform .12s ease,color .15s ease;-webkit-user-select:none;}
.tbtn:active{transform:scale(.82);}
.tbtn.on .t-icon{display:inline-block;animation:bounce .45s ease;}
.cal-nb:active{transform:scale(.82);background:var(--sf2);}
.auth-btn{transition:transform .1s,filter .1s;}
.auth-btn:active{transform:scale(.97);filter:brightness(.9);}
.notice-bar:active{transform:scale(.99);}
.next-item{transition:transform .15s ease,box-shadow .15s ease;}
.next-item:active{transform:scale(.985);}

/* 오늘 수업 펄스 */
.tc-indicator.on{animation:pulse 2.8s ease infinite;}

/* 달력 셀 */
.cd.has{cursor:pointer;transition:transform .12s ease,background .15s ease;}
.cd.has:active{transform:scale(.88);}

/* 목표 체크 */
.task-cb{transition:background .2s ease,border-color .2s ease,transform .15s ease;}
.task-cb.just-done{animation:checkPop .3s ease;}

/* 헤더 스크롤 */
.hdr{transition:box-shadow .25s ease;}
.hdr.scrolled{box-shadow:0 1px 20px rgba(0,0,0,.4);}

/* 달력 전환 애니메이션 */
.cal-body.slide-r{animation:slideRight .22s ease both;}
.cal-body.slide-l{animation:slideLeft .22s ease both;}

/* 순차 등장 */
.notice-bar.show{animation:fadeUp .35s .0s ease both;}
.cal-wrap{animation:fadeUp .35s .05s ease both;}
.today-wrap{animation:fadeUp .35s .1s ease both;}
.next-wrap{animation:fadeUp .35s .15s ease both;}
.goal-wrap{animation:fadeUp .35s .2s ease both;}
.auth-card{animation:fadeUp .4s ease both;}
.ntc-card,.asgn-card{transition:opacity .2s,transform .2s;}

/* 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--sf2);border:1px solid var(--bd2);border-radius:14px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--tx);opacity:0;transition:all .28s ease;pointer-events:none;z-index:200;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(58,168,106,.4);color:var(--green);}
.toast.info{border-color:rgba(74,143,212,.4);color:var(--blue);}

/* 날짜 상세 바텀시트 */
.bottom-sheet{display:none;position:fixed;inset:0;z-index:50;}
.bottom-sheet.on{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
.bs-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
.bs-card{position:relative;background:var(--sf);border-radius:24px 24px 0 0;padding:20px 24px calc(32px + env(safe-area-inset-bottom));width:100%;max-width:600px;animation:fadeUp .25s ease;}
.bs-handle{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 18px;}
.bs-date{font-size:17px;font-weight:800;margin-bottom:14px;}
.bs-chip{background:rgba(74,143,212,.1);border:1px solid rgba(74,143,212,.2);border-radius:12px;padding:11px 16px;margin-bottom:8px;display:flex;gap:10px;align-items:center;}
.bs-chip.sp{background:rgba(200,148,10,.08);border-color:rgba(200,148,10,.2);}
.bs-tnum{font-size:14px;font-weight:700;color:var(--blue);}

/* 스와이프 */
.scr{touch-action:pan-y;}

/* ── 애니메이션 ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,143,212,.4)}50%{box-shadow:0 0 0 8px rgba(74,143,212,0)}}
@keyframes checkPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.fade-up{animation:fadeUp .35s ease both;}
.slide-in{animation:slideIn .25s ease both;}

/* 스켈레톤 */
.skel{background:linear-gradient(90deg,var(--sf2) 25%,var(--sf3) 50%,var(--sf2) 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
.skel-line{height:14px;margin-bottom:8px;}
.skel-line.short{width:60%;}
.skel-block{height:80px;margin-bottom:12px;border-radius:16px;}

/* 탭 전환 */
.pane{opacity:0;transform:translateX(8px);transition:opacity .22s ease, transform .22s ease;}
.pane.on{opacity:1;transform:translateX(0);}

/* 버튼 눌림 */
.tbtn{transition:transform .1s ease,color .15s ease;}
.tbtn:active{transform:scale(.85);}
.cal-nb{transition:transform .1s ease,background .15s ease;}
.cal-nb:active{transform:scale(.85);background:var(--sf2);}
.auth-btn{transition:transform .1s ease,opacity .15s ease;}
.auth-btn:active{transform:scale(.97);}

/* 오늘 수업 펄스 */
.tc-indicator.on{animation:pulse 2.5s infinite;}

/* 달력 셀 탭 */
.cd{transition:transform .1s ease,background .15s ease;cursor:default;}
.cd.has{cursor:pointer;}
.cd.has:active{transform:scale(.9);}

/* 수업 카드 */
.next-item{transition:transform .15s ease,box-shadow .15s ease;}
.next-item:active{transform:scale(.98);}
.next-item.expanded .ni-times{max-height:200px;}
.ni-times{max-height:60px;overflow:hidden;transition:max-height .3s ease;}

/* 공지 카드 */
.ntc-card{transition:transform .15s ease,opacity .2s ease;}
.ntc-card:active{transform:scale(.99);}
.ntc-card.read{opacity:.6;}

/* 목표 체크 */
.task-cb{transition:all .2s ease;}
.task-cb.done{animation:checkPop .25s ease;}

/* 탭바 아이콘 */
.t-icon{transition:transform .2s ease;}
.tbtn.on .t-icon{animation:bounce .4s ease;}

/* 헤더 스크롤 효과 */
.hdr{transition:box-shadow .2s ease,background .2s ease;}
.hdr.scrolled{box-shadow:0 2px 16px rgba(0,0,0,.3);}

/* 공지 배너 */
.notice-bar{transition:transform .15s ease,background .15s ease;}
.notice-bar:active{transform:scale(.99);}

/* 스와이프 힌트 */
.swipe-hint{font-size:11px;color:var(--tx3);text-align:center;padding:6px 0 0;opacity:.6;}

/* 달력 전환 */
.cal-body{transition:opacity .2s ease,transform .2s ease;}
.cal-body.switching{opacity:0;transform:translateX(20px);}

/* 섹션 순차 등장 */
.cal-wrap{animation:fadeUp .4s .05s ease both;}
.today-wrap{animation:fadeUp .4s .1s ease both;}
.next-wrap{animation:fadeUp .4s .15s ease both;}

/* 로그인 카드 */

/* 토스트 알림 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sf2);border:1px solid var(--bd2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--tx);opacity:0;transition:all .3s ease;pointer-events:none;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 오늘 날짜 탭 상세 */

<script>
const DB='https://hwa1-c1ad9-default-rtdb.firebaseio.com';
const TM={'1':'10:00~13:30','2':'14:00~17:30','3':'18:30~22:00'};
const DY=['일','월','화','수','목','금','토'];
let me=null, sch={}, ntcData={}, asnData={};
let calY=new Date().getFullYear(), calM=new Date().getMonth()+1;
let schY=new Date().getFullYear(), schM=new Date().getMonth()+1;
let goalEditing=false;

// ── 인증 ──
function showAuth(id){document.querySelectorAll('.auth').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on');}
async function hashPw(pw,name){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+name+'hwagangam2024'));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function mkUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

async function init(){
  const s=localStorage.getItem('hwa_user');if(!s)return;
  try{
    const u=JSON.parse(s);
    const r=await fetch(`${DB}/approved_users/${u.uid}.json`);
    const d=await r.json();
    if(d&&d.name===u.name){me=u;enterApp();}
    else{
      const r2=await fetch(`${DB}/pending_users/${u.uid}.json`);
      const p=await r2.json();
      if(p&&p.name===u.name){me=u;showAuth('vPending');}
      else{localStorage.removeItem('hwa_user');}
    }
  }catch(e){}
}

async function doLogin(){
  haptic('light');
  const name=document.getElementById('lName').value.trim(),pw=document.getElementById('lPw').value;
  const msg=document.getElementById('loginMsg');msg.className='auth-msg';
  if(!name||!pw){msg.className='auth-msg err';msg.textContent='이름과 비밀번호를 입력하세요.';return;}
  try{
    const r=await fetch(`${DB}/approved_users.json?_=${Date.now()}`);
    const all=r.ok?(await r.json()||{}):null;
    if(!all){msg.className='auth-msg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    const entries=Object.entries(all).filter(([_,u])=>u.name===name);
    if(!entries.length){msg.className='auth-msg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    let found=null;
    for(const [id,u] of entries){if(u.pw===await hashPw(pw,name)){found={uid:id,...u};break;}}
    if(!found){msg.className='auth-msg err';msg.textContent='비밀번호가 틀렸습니다.';return;}
    me={uid:found.uid,name:found.name,cls:found.cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));enterApp();
  }catch(e){msg.className='auth-msg err';msg.textContent='오류가 발생했습니다.';}
}

async function doSignup(){
  const name=document.getElementById('sName').value.trim(),cls=document.getElementById('sCls').value;
  const pw=document.getElementById('sPw').value,pw2=document.getElementById('sPw2').value;
  const msg=document.getElementById('signupMsg');msg.className='auth-msg';
  if(!name||!cls||!pw){msg.className='auth-msg err';msg.textContent='모든 항목을 입력하세요.';return;}
  if(pw.length<4){msg.className='auth-msg err';msg.textContent='비밀번호는 4자 이상이어야 합니다.';return;}
  if(pw!==pw2){msg.className='auth-msg err';msg.textContent='비밀번호가 일치하지 않습니다.';return;}
  try{
    const [ar,pr]=await Promise.all([fetch(`${DB}/approved_users.json?_=${Date.now()}`),fetch(`${DB}/pending_users.json?_=${Date.now()}`)]);
    const ap=ar.ok?(await ar.json()||{}):{},pe=pr.ok?(await pr.json()||{}):{};
    if([...Object.values(ap),...Object.values(pe)].some(u=>u.name===name)){msg.className='auth-msg err';msg.textContent='이미 가입된 이름입니다.';return;}
    const id=mkUid();
    await fetch(`${DB}/pending_users/${id}.json`,{method:'PUT',body:JSON.stringify({name,cls,pw:await hashPw(pw,name),createdAt:new Date().toISOString()}),headers:{'Content-Type':'application/json'}});
    me={uid:id,name,cls};localStorage.setItem('hwa_user',JSON.stringify(me));showAuth('vPending');
  }catch(e){msg.className='auth-msg err';msg.textContent='오류가 발생했습니다.';}
}

async function checkApproval(){
  if(!me)return;
  const r=await fetch(`${DB}/approved_users/${me.uid}.json`);
  const d=await r.json();
  if(d&&d.name===me.name)enterApp();else alert('아직 승인 대기 중입니다.');
}
function doLogout(){localStorage.removeItem('hwa_user');me=null;location.reload();}

// ── 앱 진입 ──
async function enterApp(){
  document.querySelectorAll('.auth').forEach(v=>v.classList.remove('on'));
  document.getElementById('vApp').classList.add('on');
  document.getElementById('hdrUser').textContent=me.name+' · '+me.cls;
  const r=await fetch(`${DB}/schedule_backup.json?_=${Date.now()}`);
  sch=r.ok?(await r.json()||{}):{};
  renderHome();
  renderSchTab();
  loadNotices();
  loadGallery();
  loadChat();
  loadGoal();
}

// ── 헬퍼 ──
function myD(y,m){return sch[`${me.cls}_${me.name}_${m}`]||{};}
function ds(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

// ── 달력 렌더 ──
function renderCal(y,m,bodyId){
  const sd=myD(y,m);
  const reg=new Set((sd.lessons||[]).map(l=>l.day));
  const sp=new Set((sd.special||[]).filter(l=>!reg.has(l.day)).map(l=>l.day));
  const now=new Date(),ts=ds(now.getFullYear(),now.getMonth()+1,now.getDate());
  const first=new Date(y,m-1,1).getDay(),total=new Date(y,m,0).getDate();
  let h='';
  for(let i=0;i<first;i++)h+=`<div class="cd"></div>`;
  for(let d=1;d<=total;d++){
    const dw=new Date(y,m-1,d).getDay(),dk=ds(y,m,d);
    const isToday=dk===ts,hasR=reg.has(d),hasSp=sp.has(d);
    let cls='cd';
    if(isToday)cls+=' has today';
    else if(hasR)cls+=' has'+(dw===0?' sun':dw===6?' sat':'');
    else if(hasSp)cls+=' sp-only';
    h+=`<div class="${cls}">${d}${(hasR||hasSp||isToday)?'<div class="cd-dot"></div>':''}</div>`;
  }
  document.getElementById(bodyId).innerHTML=h;
}

// ── 홈 ──
function renderHome(){
  document.getElementById('calTitle').textContent=`${calY}년 ${calM}월`;
  renderCal(calY,calM,'calBody');

  const now=new Date(),m=now.getMonth()+1,d=now.getDate(),y=now.getFullYear();
  const dw=DY[now.getDay()];
  const sd=myD(y,m);
  const reg=(sd.lessons||[]).filter(l=>l.day===d);
  const sp=(sd.special||[]).filter(l=>l.day===d);
  const tims=[...new Set([...reg.map(l=>l.tim),...sp.map(l=>l.tim)])].sort();

  const tc=document.getElementById('todayCard');
  if(!tims.length){
    tc.innerHTML=`<div class="today-card"><div class="tc-head"><div class="tc-indicator"></div><div class="tc-info"><div class="tc-date">${m}월 ${d}일 (${dw})</div><div class="tc-status" style="color:var(--tx2)">오늘은 수업이 없어요</div></div></div></div>`;
  }else{
    const chips=tims.map(t=>{const isSp=sp.some(l=>l.tim===t)&&!reg.some(l=>l.tim===t);return `<div class="tc-chip${isSp?' sp':''}"><div class="tc-tnum">${t}타임</div><div class="tc-trange">${TM[String(t)]}</div>${isSp?'<span class="tc-stag">특강</span>':''}</div>`;}).join('');
    tc.innerHTML=`<div class="today-card active"><div class="tc-head"><div class="tc-indicator on"></div><div class="tc-info"><div class="tc-date">${m}월 ${d}일 (${dw})</div><div class="tc-status">오늘 수업 ${tims.length}타임</div></div></div><div class="tc-chips">${chips}</div></div>`;
  }

  const todayStr=ds(y,m,d);
  const up=[];
  for(let mi=0;mi<3;mi++){
    const td=new Date(y,now.getMonth()+mi,1),ty=td.getFullYear(),tm=td.getMonth()+1;
    const sd2=myD(ty,tm);
    const bd={};
    [...(sd2.lessons||[]),...(sd2.special||[])].forEach(l=>{
      if(!bd[l.day])bd[l.day]={r:[],s:[]};
      if((sd2.lessons||[]).some(x=>x.day===l.day&&x.tim===l.tim))bd[l.day].r.push(l.tim);
      else bd[l.day].s.push(l.tim);
    });
    Object.keys(bd).map(Number).sort((a,b)=>a-b).forEach(dd=>{if(ds(ty,tm,dd)>todayStr)up.push({ty,tm,dd,...bd[dd]});});
  }
  const nl=document.getElementById('nextList');
  if(!up.length){nl.innerHTML='<div class="empty">예정된 수업이 없습니다</div>';return;}
  nl.innerHTML=up.slice(0,5).map(({ty,tm,dd,r,s})=>{
    const dw2=new Date(ty,tm-1,dd).getDay(),dwN=DY[dw2],dwC=dw2===0?' sun':dw2===6?' sat':'';
    const ts2=[...new Set([...r,...s])].sort();
    const rows=ts2.map(t=>{const isSp=s.includes(t)&&!r.includes(t);return `${t}타임 ${TM[String(t)]}${isSp?'<span class="sp-pip">특강</span>':''}`;}).join('<br>');
    return `<div class="next-item"><div class="ni-date-col"><div class="ni-day-num">${dd}</div><div class="ni-day-label${dwC}">${tm}/${dd}<br>${dwN}</div></div><div class="ni-sep"></div><div class="ni-times">${rows}</div></div>`;
  }).join('');
}

  haptic('light');

  body.style.animation='none';
  body.offsetHeight;
  body.style.animation=dir>0?'slideRight .22s ease both':'slideLeft .22s ease both';

}

function filterNtc(type,btn){
  if(btn){document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
  const cont=document.getElementById('ntcContent');
  let html='';
  if(type==='all'||type==='notice'){
    const notices=Object.entries(ntcData).filter(([_,n])=>!n.cls||n.cls===me.cls||n.cls==='전체').sort((a,b)=>new Date(b[1].createdAt)-new Date(a[1].createdAt));
    if(type==='all'&&notices.length)html+=`<div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;margin-bottom:8px">공지사항</div>`;
    html+=notices.map(([id,n])=>{
      const bc=n.urgent?'nb-hot':n.cls&&n.cls!=='전체'?'nb-cls':'nb-all';
      const bt=n.urgent?'긴급':n.cls&&n.cls!=='전체'?n.cls:'전체';
      const dt=new Date(n.createdAt).toLocaleDateString('ko',{month:'short',day:'numeric'});
      return `<div class="ntc-card" onclick="this.querySelector('.ntc-body').classList.toggle('clamp');localStorage.setItem('nr_${id}','1')"><div class="ntc-top"><span class="ntc-badge ${bc}">${bt}</span><span class="ntc-date">${dt}</span></div><div class="ntc-title">${n.title}</div><div class="ntc-body clamp">${n.body}</div></div>`;
    }).join('');
    if(!notices.length&&type==='notice')html='<div class="empty">공지사항이 없습니다</div>';
  }
  if(type==='all'||type==='assign'){
    const assigns=Object.entries(asnData).filter(([_,a])=>!a.cls||a.cls===me.cls||a.cls==='전체').sort((a,b)=>new Date(a[1].due)-new Date(b[1].due));
    if(type==='all'&&assigns.length)html+=`<div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;margin:16px 0 8px">과제</div>`;
    const now=new Date();
    html+=assigns.map(([_,a])=>{const ov=new Date(a.due)<now,ds2=new Date(a.due).toLocaleDateString('ko',{month:'short',day:'numeric'});
      return `<div class="asgn-card"><div class="asgn-top"><div class="asgn-ttl">${a.title}</div><div class="asgn-due${ov?' past':''}">마감 ${ds2}</div></div><div class="asgn-body">${a.body}</div></div>`;}).join('');
    if(!assigns.length&&type==='assign')html='<div class="empty">과제가 없습니다</div>';
  }
  if(!html)html='<div class="empty">내용이 없습니다</div>';
  cont.innerHTML=html;
  setTimeout(initNtcCards,100);
}

function addMyPhotos(input){
  const files=Array.from(input.files);
  if(!files.length)return;
  let done=0;
  const photos=JSON.parse(localStorage.getItem('hwa_photos_'+me.uid)||'[]');
  files.forEach(file=>{
    if(!file.type.startsWith('image/')){done++;return;}
    // 이미지 리사이즈 후 base64 저장
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1200;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const url=canvas.toDataURL('image/jpeg',0.82);
        photos.unshift({url,caption:'',createdAt:new Date().toISOString()});
        done++;
        if(done===files.length){
          localStorage.setItem('hwa_photos_'+me.uid,JSON.stringify(photos));
          loadMyGallery();
          showToast('사진 '+files.length+'장 추가됐습니다 🎨','ok');
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}

async function sendMsg(){
  haptic('medium');
  const ta=document.getElementById('chatInput');const text=ta.value.trim();if(!text)return;
  await fetch(`${DB}/messages/${me.uid}/${Date.now().toString(36)}.json`,{method:'PUT',body:JSON.stringify({text,from:'student',name:me.name,cls:me.cls,createdAt:new Date().toISOString(),read:false}),headers:{'Content-Type':'application/json'}});
  ta.value='';ta.style.height='auto';loadChat();
  showToast('전송됐습니다','ok');
}

// ── 토스트 ──
let toastTimer=null;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(type?' '+type:'');
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>{t.classList.add('show');});
  toastTimer=setTimeout(()=>{t.classList.remove('show');},2200);
}

// ── 햅틱 ──
function haptic(type='light'){
  if(navigator.vibrate){
    navigator.vibrate(type==='light'?8:type==='medium'?20:50);
  }
}

// ── 달력 날짜 클릭 → 바텀시트 ──
function openDaySheet(y,m,d){
  haptic('light');
  const dw=['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  const sd=myD(y,m);
  const reg=(sd.lessons||[]).filter(l=>l.day===d);
  const sp=(sd.special||[]).filter(l=>l.day===d);
  const tims=[...new Set([...reg.map(l=>l.tim),...sp.map(l=>l.tim)])].sort();
  document.getElementById('bsDate').textContent=`${m}월 ${d}일 (${dw})`;
  document.getElementById('bsContent').innerHTML=tims.length
    ?tims.map(t=>{const isSp=sp.some(l=>l.tim===t)&&!reg.some(l=>l.tim===t);return `<div class="bs-chip${isSp?' sp':''}"><div class="bs-tnum">${t}타임</div><div class="bs-trange">${TM[String(t)]}</div>${isSp?'<span class="bs-stag">특강</span>':''}</div>`;}).join('')
    :'<div class="bs-empty">수업 없음</div>';
  document.getElementById('daySheet').classList.add('on');
}
function closeDaySheet(){document.getElementById('daySheet').classList.remove('on');}

// ── 스와이프로 달력 이동 ──
let swipeStartX=0,swipeStartY=0;
function initSwipe(){
  const scr=document.getElementById('mainScr');
  scr.addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;},{passive:true});
  scr.addEventListener('touchend',e=>{
    if(!document.getElementById('pane-home').classList.contains('on'))return;
    const dx=e.changedTouches[0].clientX-swipeStartX;
    const dy=Math.abs(e.changedTouches[0].clientY-swipeStartY);
    if(Math.abs(dx)>60&&dy<40){
      if(dx<0)moveCal(1);else moveCal(-1);
    }
  },{passive:true});
}

// ── 헤더 스크롤 감지 ──
function initScrollHeader(){
  const scr=document.getElementById('mainScr');
  const hdr=document.querySelector('.hdr');
  scr.addEventListener('scroll',()=>{
    hdr.classList.toggle('scrolled',scr.scrollTop>10);
  },{passive:true});
}

// ── 달력 클릭 이벤트 위임 ──
function initCalClick(){
  ['calBody','schCalBody'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('click',e=>{
      const cd=e.target.closest('.cd.has');if(!cd)return;
      const cells=[...el.querySelectorAll('.cd')];
      const idx=cells.indexOf(cd);
      const first=new Date(calY,calM-1,1).getDay();
      const d=idx-first+1;
      if(d<1)return;
      const y=id==='calBody'?calY:schY;
      const m=id==='calBody'?calM:schM;
      openDaySheet(y,m,d);
    });
  });
}







// ── 다음 수업 카드 클릭 → 펼치기 ──
function initNextExpand(){
  document.getElementById('nextList').addEventListener('click',e=>{
    const item=e.target.closest('.next-item');if(!item)return;
    haptic('light');
    item.classList.toggle('expanded');
    const times=item.querySelector('.ni-times');
    if(times){
      times.style.maxHeight=item.classList.contains('expanded')?times.scrollHeight+'px':'60px';
    }
  });
}


function initNtcCards(){
  document.querySelectorAll('.ntc-card').forEach(card=>{
    card.addEventListener('click',()=>{
      haptic('light');
      if(!card.classList.contains('read')){
        setTimeout(()=>card.classList.add('read'),200);
      }
    });
  });
}







// ── 초기화 ──
window.addEventListener('DOMContentLoaded',()=>{
  initSwipe();
  initScrollHeader();
  setTimeout(()=>{initCalClick();initNextExpand();},500);
});

init();
</script>
