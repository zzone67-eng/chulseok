<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화강암+ 수업 일정</title>
<style>
:root{
  --bg:#0F0F12; --sf:#1A1A1F; --sf2:#242428;
  --bd:#2C2C33; --bd2:#38383F;
  --tx:#E8E6E0; --tx2:#8A8880; --tx3:#46464E;
  --red:#C94040; --blue:#4A8FD4; --green:#3AA86A; --yellow:#C8940A;
  --acc:#C94040;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

/* 공통 */
.view{display:none;min-height:100vh;}
.view.on{display:flex;}
.center{flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.logo span{color:var(--acc);}
.sub{font-size:13px;color:var(--tx2);margin-bottom:40px;}
.card{width:100%;max-width:360px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px;}
.card-title{font-size:16px;font-weight:700;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:600;color:var(--tx3);display:block;margin-bottom:6px;letter-spacing:.06em;}
.field input, .field select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:15px;font-family:inherit;outline:none;}
.field input:focus, .field select:focus{border-color:var(--acc);}
.field select option{background:var(--sf);}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn.primary{background:var(--acc);color:#fff;}
.btn.secondary{background:var(--sf2);color:var(--tx2);margin-top:10px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.link-btn{background:none;border:none;color:var(--tx2);font-size:13px;cursor:pointer;text-decoration:underline;margin-top:16px;display:block;text-align:center;}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none;}
.msg.err{background:#2A1515;color:#E06060;display:block;}
.msg.ok{background:#152A1E;color:var(--green);display:block;}

/* 대기 화면 */
.pending-icon{font-size:48px;margin-bottom:16px;}
.pending-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.pending-desc{font-size:14px;color:var(--tx2);text-align:center;line-height:1.6;margin-bottom:24px;}

/* 메인 */
.main-view{flex-direction:column;max-width:480px;margin:0 auto;width:100%;}
.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.hdr-name{font-size:17px;font-weight:700;flex:1;}
.hdr-cls{font-size:12px;color:var(--tx2);}
.logout-btn{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:12px;padding:5px 10px;cursor:pointer;}
.mon-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;}
.mon-label{font-size:16px;font-weight:700;}
.mon-btn{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);padding:6px 14px;cursor:pointer;font-size:16px;}
.cal{padding:0 16px;}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px;}
.cal-hd{font-size:11px;font-weight:600;color:var(--tx3);padding:4px 0;}
.cal-hd:first-child{color:var(--red);}
.cal-hd:last-child{color:var(--blue);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);}
.cal-day.has{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);}
.cal-day.has.sun{color:var(--red);}
.cal-day.has.sat{color:var(--blue);}
.cal-day.today{border-color:var(--acc)!important;color:var(--acc)!important;}
.dots{display:flex;gap:2px;margin-top:2px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--blue);}
.dot.sp{background:var(--yellow);}
.section{padding:16px 20px 0;}
.sec-title{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.08em;margin-bottom:10px;}
.summary{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);}
.sum-row:last-child{border:none;}
.sum-label{font-size:13px;color:var(--tx2);}
.sum-val{font-size:14px;font-weight:700;}
.class-item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:8px;}
.class-date{font-size:14px;font-weight:700;margin-bottom:4px;}
.class-time{font-size:13px;color:var(--tx2);line-height:1.8;}
.tag-sp{display:inline;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;background:#2A1F0A;color:var(--yellow);margin-left:4px;}
.empty{color:var(--tx3);font-size:13px;text-align:center;padding:30px 0;}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="view on center" id="loginView">
  <div class="logo">화강암<span>+</span></div>
  <div class="sub">수업 일정 조회</div>
  <div class="card">
    <div class="card-title">로그인</div>
    <div class="msg" id="loginMsg"></div>
    <div class="field"><label>이름</label><input type="text" id="loginName" placeholder="홍길동"></div>
    <div class="field"><label>비밀번호</label><input type="password" id="loginPw" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn primary" onclick="doLogin()">로그인</button>
    <button class="link-btn" onclick="showView('signupView')">처음이신가요? 회원가입</button>
  </div>
</div>

<!-- 회원가입 -->
<div class="view center" id="signupView">
  <div class="logo">화강암<span>+</span></div>
  <div class="sub">회원가입</div>
  <div class="card">
    <div class="card-title">계정 만들기</div>
    <div class="msg" id="signupMsg"></div>
    <div class="field"><label>이름</label><input type="text" id="signupName" placeholder="홍길동"></div>
    <div class="field">
      <label>반</label>
      <select id="signupCls">
        <option value="">반 선택</option>
        <option>입시반</option><option>예비반</option><option>중등반</option><option>취미반</option>
      </select>
    </div>
    <div class="field"><label>비밀번호</label><input type="password" id="signupPw" placeholder="4자리 이상"></div>
    <div class="field"><label>비밀번호 확인</label><input type="password" id="signupPw2" placeholder="다시 입력" onkeydown="if(event.key==='Enter')doSignup()"></div>
    <button class="btn primary" onclick="doSignup()">가입 신청</button>
    <button class="link-btn" onclick="showView('loginView')">이미 계정이 있어요</button>
  </div>
</div>

<!-- 승인 대기 -->
<div class="view center" id="pendingView">
  <div class="pending-icon">⏳</div>
  <div class="pending-title">승인 대기 중</div>
  <div class="pending-desc">원장님이 계정을 승인하면<br>자동으로 로그인됩니다.<br><br>잠시 후 다시 시도해주세요.</div>
  <button class="btn secondary" style="max-width:240px" onclick="checkApproval()">승인 확인</button>
  <button class="link-btn" onclick="doLogout()">다른 계정으로</button>
</div>

<!-- 메인 시간표 -->
<div class="view main-view" id="mainView">
  <div class="hdr">
    <div style="flex:1">
      <div class="hdr-name" id="hdrName"></div>
      <div class="hdr-cls" id="hdrCls"></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
  <div class="mon-nav">
    <button class="mon-btn" onclick="moveMon(-1)">‹</button>
    <div class="mon-label" id="monLabel"></div>
    <button class="mon-btn" onclick="moveMon(1)">›</button>
  </div>
  <div class="cal">
    <div class="cal-hdr">
      <div class="cal-hd">일</div><div class="cal-hd">월</div><div class="cal-hd">화</div>
      <div class="cal-hd">수</div><div class="cal-hd">목</div><div class="cal-hd">금</div>
      <div class="cal-hd">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="section" style="margin-top:16px;">
    <div class="sec-title">이번달 요약</div>
    <div id="summaryBox"></div>
  </div>
  <div class="section" style="margin-top:16px;">
    <div class="sec-title">수업 일정</div>
    <div id="classList"></div>
  </div>
</div>

<script>
const DB='https://hwa1-c1ad9-default-rtdb.firebaseio.com';
const TIMES={'1':'10:00~13:30','2':'14:00~17:30','3':'18:30~22:00'};
const DAY=['일','월','화','수','목','금','토'];
let curY=new Date().getFullYear(), curM=new Date().getMonth()+1;
let me=null; // {name, cls, uid}

// 뷰 전환
function showView(id){
  document.querySelectorAll('.view').forEach(v=>{v.classList.remove('on');});
  document.getElementById(id).classList.add('on');
}

// 해시 비밀번호 (간단 버전)
async function hashPw(pw,name){
  const msg=pw+name+'hwagangam2024';
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// uid 생성
function makeUid(name,cls){
  return (name+cls).split('').map(c=>c.charCodeAt(0).toString(16)).join('').slice(0,20)+'_'+Date.now().toString(36);
}

// 자동 로그인 체크
async function init(){
  const saved=localStorage.getItem('hwa_user');
  if(!saved){showView('loginView');return;}
  try{
    const u=JSON.parse(saved);
    // 승인 여부 확인
    const r=await fetch(`${DB}/approved_users/${u.uid}.json`);
    const data=await r.json();
    if(data&&data.name===u.name){
      me=u;
      enterMain();
    } else {
      // 대기 중인지 확인
      const r2=await fetch(`${DB}/pending_users/${u.uid}.json`);
      const pd=await r2.json();
      if(pd&&pd.name===u.name){
        me=u;
        showView('pendingView');
      } else {
        localStorage.removeItem('hwa_user');
        showView('loginView');
      }
    }
  }catch(e){showView('loginView');}
}

// 로그인
async function doLogin(){
  const name=document.getElementById('loginName').value.trim();
  const pw=document.getElementById('loginPw').value;
  const msg=document.getElementById('loginMsg');
  msg.className='msg';
  if(!name||!pw){msg.className='msg err';msg.textContent='이름과 비밀번호를 입력하세요.';return;}

  try{
    // approved_users에서 이름으로 검색
    const r=await fetch(`${DB}/approved_users.json?orderBy="name"&equalTo="${name}"&_=${Date.now()}`);
    const data=await r.json();
    if(!data){msg.className='msg err';msg.textContent='승인되지 않은 계정입니다.';return;}

    // 비밀번호 확인
    const entries=Object.entries(data);
    let found=null;
    for(const [uid,u] of entries){
      const hash=await hashPw(pw,name);
      if(u.pw===hash){found={uid,...u};break;}
    }
    if(!found){msg.className='msg err';msg.textContent='비밀번호가 틀렸습니다.';return;}

    me={uid:found.uid,name:found.name,cls:found.cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));
    enterMain();
  }catch(e){msg.className='msg err';msg.textContent='오류가 발생했습니다.';}
}

// 회원가입
async function doSignup(){
  const name=document.getElementById('signupName').value.trim();
  const cls=document.getElementById('signupCls').value;
  const pw=document.getElementById('signupPw').value;
  const pw2=document.getElementById('signupPw2').value;
  const msg=document.getElementById('signupMsg');
  msg.className='msg';

  if(!name||!cls||!pw){msg.className='msg err';msg.textContent='모든 항목을 입력하세요.';return;}
  if(pw.length<4){msg.className='msg err';msg.textContent='비밀번호는 4자 이상이어야 합니다.';return;}
  if(pw!==pw2){msg.className='msg err';msg.textContent='비밀번호가 일치하지 않습니다.';return;}

  try{
    // 이미 가입됐는지 확인
    const r=await fetch(`${DB}/approved_users.json?orderBy="name"&equalTo="${name}"&_=${Date.now()}`);
    const existing=await r.json();
    if(existing){msg.className='msg err';msg.textContent='이미 가입된 이름입니다.';return;}

    const uid=makeUid(name,cls);
    const hash=await hashPw(pw,name);
    await fetch(`${DB}/pending_users/${uid}.json`,{
      method:'PUT',
      body:JSON.stringify({name,cls,pw:hash,createdAt:new Date().toISOString()}),
      headers:{'Content-Type':'application/json'}
    });

    me={uid,name,cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));
    showView('pendingView');
  }catch(e){msg.className='msg err';msg.textContent='오류가 발생했습니다.';}
}

// 승인 확인
async function checkApproval(){
  if(!me)return;
  try{
    const r=await fetch(`${DB}/approved_users/${me.uid}.json`);
    const data=await r.json();
    if(data&&data.name===me.name){
      enterMain();
    } else {
      alert('아직 승인 대기 중입니다. 원장님께 문의하세요.');
    }
  }catch(e){alert('오류가 발생했습니다.');}
}

// 로그아웃
function doLogout(){
  localStorage.removeItem('hwa_user');
  me=null;
  showView('loginView');
}

// 메인 진입
function enterMain(){
  document.getElementById('hdrName').textContent=me.name;
  document.getElementById('hdrCls').textContent=me.cls;
  showView('mainView');
  loadAndRender();
}

async function moveMon(dir){
  curM+=dir;
  if(curM>12){curM=1;curY++;}
  if(curM<1){curM=12;curY--;}
  await loadAndRender();
}

async function loadAndRender(){
  const ym=`${curY}-${String(curM).padStart(2,'0')}`;
  document.getElementById('monLabel').textContent=`${curY}년 ${curM}월`;
  document.getElementById('calGrid').innerHTML='';
  document.getElementById('summaryBox').innerHTML='<div class="empty">불러오는 중...</div>';
  document.getElementById('classList').innerHTML='';

  try{
    const [tr,sr]=await Promise.all([
      fetch(`${DB}/timetable/${ym}.json?_=${Date.now()}`),
      fetch(`${DB}/schedule_backup.json?_=${Date.now()}`)
    ]);
    const timetable=tr.ok?(await tr.json()||{}):{};
    const backup=sr.ok?(await sr.json()||{}):{};
    const key=`${me.cls}_${me.name}_${curM}`;
    const sdata=backup[key]||{};
    renderCal(timetable,sdata);
    renderClasses(sdata);
  }catch(e){
    document.getElementById('summaryBox').innerHTML='<div class="empty">불러오기 실패</div>';
  }
}

function renderCal(timetable,sdata){
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  const firstDay=new Date(curY,curM-1,1).getDay();
  const totalDays=new Date(curY,curM,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  for(let i=0;i<firstDay;i++) grid.appendChild(Object.assign(document.createElement('div'),{className:'cal-day'}));

  const regDays=new Set((sdata.lessons||[]).map(l=>l.day));
  const spDays=new Set((sdata.special||[]).map(l=>l.day));

  for(let d=1;d<=totalDays;d++){
    const dk=`${curY}-${String(curM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dw=new Date(curY,curM-1,d).getDay();
    const hasReg=regDays.has(d), hasSp=spDays.has(d), hasClass=hasReg||hasSp;
    const cell=document.createElement('div');
    cell.className='cal-day'+(hasClass?' has':'')+(dw===0?' sun':dw===6?' sat':'')+(dk===todayStr?' today':'');
    cell.innerHTML=`<span>${d}</span>${hasClass?`<div class="dots">${hasReg?'<div class="dot"></div>':''}${hasSp?'<div class="dot sp"></div>':''}</div>`:''}`;
    grid.appendChild(cell);
  }
}

function renderClasses(sdata){
  const regLessons=sdata.lessons||[];
  const spLessons=sdata.special||[];
  const absT=sdata.abs||0;
  const totalReg=regLessons.length, totalSp=spLessons.length;

  document.getElementById('summaryBox').innerHTML=`<div class="summary">
    <div class="sum-row"><span class="sum-label">정규 수업</span><span class="sum-val" style="color:var(--blue)">${totalReg}T</span></div>
    ${totalSp?`<div class="sum-row"><span class="sum-label">특강</span><span class="sum-val" style="color:var(--yellow)">${totalSp}T</span></div>`:''}
    ${absT?`<div class="sum-row"><span class="sum-label">전월 결석</span><span class="sum-val" style="color:var(--red)">-${absT}T</span></div>`:''}
    <div class="sum-row"><span class="sum-label">합계</span><span class="sum-val">${totalReg+totalSp-absT}T</span></div>
  </div>`;

  const byDay={};
  regLessons.forEach(l=>{if(!byDay[l.day])byDay[l.day]={reg:[],sp:[]};byDay[l.day].reg.push(l.tim);});
  spLessons.forEach(l=>{if(!byDay[l.day])byDay[l.day]={reg:[],sp:[]};byDay[l.day].sp.push(l.tim);});
  const days=Object.keys(byDay).map(Number).sort((a,b)=>a-b);

  const cl=document.getElementById('classList');
  if(!days.length){cl.innerHTML='<div class="empty">이번달 수업이 없습니다</div>';return;}

  cl.innerHTML=days.map(d=>{
    const dw=DAY[new Date(curY,curM-1,d).getDay()];
    const {reg,sp}=byDay[d];
    const allTims=[...new Set([...reg,...sp])].sort();
    const timText=allTims.map(t=>{
      const isSp=sp.includes(t)&&!reg.includes(t);
      return `${t}타임 ${TIMES[String(t)]||''}${isSp?'<span class="tag-sp">특강</span>':''}`;
    }).join('<br>');
    return `<div class="class-item"><div class="class-date">${curM}/${d} (${dw})</div><div class="class-time">${timText}</div></div>`;
  }).join('');
}

init();
</script>
</body>
</html>
