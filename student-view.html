<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>화강암+ 미술학원</title>
<style>
:root{
  --bg:#0F0F12; --sf:#1A1A1F; --sf2:#242428;
  --bd:#2C2C33; --bd2:#38383F;
  --tx:#E8E6E0; --tx2:#8A8880; --tx3:#46464E;
  --red:#C94040; --blue:#4A8FD4; --green:#3AA86A;
  --yellow:#C8940A; --purple:#8B6FD4; --acc:#C94040;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── 인증 화면 ── */
.auth-wrap{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
.auth-wrap.on{display:flex;}
.logo{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.logo span{color:var(--acc);}
.sub{font-size:13px;color:var(--tx2);margin-bottom:36px;}
.card{width:100%;max-width:340px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:18px;}
.field{margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;color:var(--tx3);display:block;margin-bottom:5px;letter-spacing:.06em;}
.field input,.field select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--acc);}
.abtn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
.abtn.primary{background:var(--acc);color:#fff;}
.link-btn{background:none;border:none;color:var(--tx2);font-size:13px;cursor:pointer;margin-top:14px;display:block;text-align:center;text-decoration:underline;}
.amsg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px;display:none;}
.amsg.err{background:#2A1515;color:#E06060;display:block;}

/* ── 앱 레이아웃 ── */
.app{display:none;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;}
.app.on{display:flex;}
.app-hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
.app-hdr-info{flex:1;}
.app-hdr-name{font-size:16px;font-weight:700;}
.app-hdr-cls{font-size:12px;color:var(--tx2);margin-top:1px;}
.logout-btn{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:12px;padding:5px 10px;cursor:pointer;}

/* 탭 네비게이션 */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:10px;font-weight:600;}
.nav-btn.on{color:var(--acc);}
.nav-icon{font-size:20px;line-height:1;}
.nav-badge{position:relative;}
.badge{position:absolute;top:-4px;right:-8px;background:var(--acc);color:#fff;border-radius:999px;font-size:9px;padding:1px 4px;font-weight:700;}

/* 탭 컨텐츠 */
.tab-content{flex:1;overflow-y:auto;padding-bottom:70px;}
.tab-pane{display:none;padding:16px;}
.tab-pane.on{display:block;}

/* 공통 섹션 */
.sec-title{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.08em;margin-bottom:10px;margin-top:20px;}
.sec-title:first-child{margin-top:0;}
.empty-msg{color:var(--tx3);font-size:13px;text-align:center;padding:24px 0;}

/* ── 홈 탭 ── */
.today-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:16px;}
.today-card.active{border-color:var(--blue);background:linear-gradient(135deg,#0E1E35 0%,var(--sf) 100%);}
.today-hdr{padding:16px 18px 12px;display:flex;align-items:center;gap:10px;}
.t-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.t-dot.off{background:var(--tx3);}
.t-date{font-size:12px;color:var(--tx2);}
.t-status{font-size:16px;font-weight:700;margin-top:2px;}
.t-times{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px;}
.t-chip{background:rgba(74,143,212,.12);border:1px solid rgba(74,143,212,.2);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.t-chip.sp{background:rgba(200,148,10,.1);border-color:rgba(200,148,10,.2);}
.t-num{font-size:13px;font-weight:700;color:var(--blue);}
.t-chip.sp .t-num{color:var(--yellow);}
.t-range{font-size:12px;color:var(--tx2);}
.t-tag{font-size:10px;font-weight:700;background:#2A1F0A;color:var(--yellow);border-radius:4px;padding:2px 6px;margin-left:auto;}

.next-item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.nd-box{text-align:center;min-width:38px;}
.nd-num{font-size:20px;font-weight:800;line-height:1;}
.nd-name{font-size:11px;color:var(--tx2);margin-top:2px;}
.nd-name.sun{color:var(--red);}
.nd-name.sat{color:var(--blue);}
.nd-div{width:1px;height:36px;background:var(--bd);}
.nd-info{flex:1;font-size:13px;color:var(--tx2);line-height:1.8;}
.sp-badge{display:inline;background:rgba(200,148,10,.15);color:var(--yellow);font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:4px;}

/* ── 시간표 탭 ── */
.mon-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.mon-label{font-size:16px;font-weight:700;}
.m-btn{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);padding:6px 12px;cursor:pointer;font-size:16px;}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px;}
.cal-hd{font-size:10px;font-weight:600;color:var(--tx3);padding:3px 0;}
.cal-hd:first-child{color:var(--red);}
.cal-hd:last-child{color:var(--blue);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px;}
.c-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);}
.c-day.has{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);}
.c-day.has.sun{color:var(--red);}
.c-day.has.sat{color:var(--blue);}
.c-day.today-r{outline:2px solid var(--acc);outline-offset:-2px;}
.c-dots{display:flex;gap:2px;margin-top:2px;}
.c-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);}
.c-dot.sp{background:var(--yellow);}
.stat-box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.s-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--bd);}
.s-row:last-child{border:none;}
.s-lbl{font-size:13px;color:var(--tx2);}
.s-val{font-size:14px;font-weight:700;}
.class-list-item{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.cli-date{font-size:13px;font-weight:700;margin-bottom:3px;}
.cli-time{font-size:12px;color:var(--tx2);line-height:1.7;}

/* ── 공지사항 탭 ── */
.notice-item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;}
.notice-item:active{background:var(--sf2);}
.ni-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ni-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;}
.ni-badge.all{background:rgba(74,143,212,.15);color:var(--blue);}
.ni-badge.cls{background:rgba(200,148,10,.15);color:var(--yellow);}
.ni-badge.urgent{background:rgba(201,64,64,.15);color:var(--red);}
.ni-date{font-size:11px;color:var(--tx3);margin-left:auto;}
.ni-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.ni-body{font-size:13px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;}
.ni-body.collapsed{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* 과제 */
.assign-item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:8px;}
.ai-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ai-title{font-size:14px;font-weight:700;}
.ai-due{font-size:11px;color:var(--red);font-weight:600;}
.ai-due.ok{color:var(--tx3);}
.ai-body{font-size:13px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;}

/* ── 갤러리 탭 ── */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:12px;}
.gallery-item{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sf2);cursor:pointer;position:relative;}
.gallery-item img{width:100%;height:100%;object-fit:cover;}
.gallery-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:4px 6px;font-size:10px;color:#fff;}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.lightbox.on{display:flex;}
.lightbox img{max-width:100%;max-height:80vh;border-radius:12px;object-fit:contain;}
.lightbox-close{position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;padding:4px 10px;}
.lightbox-cap{color:#ccc;font-size:13px;margin-top:12px;text-align:center;}

/* ── 상담 탭 ── */
.msg-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.msg-bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;}
.msg-bubble.mine{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg-bubble.theirs{background:var(--sf);border:1px solid var(--bd);align-self:flex-start;border-bottom-left-radius:4px;}
.msg-time{font-size:10px;color:var(--tx3);margin-top:3px;}
.msg-time.mine{text-align:right;}
.msg-input-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;position:sticky;bottom:70px;}
.msg-textarea{width:100%;padding:12px 14px;background:transparent;border:none;color:var(--tx);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:80px;}
.msg-send{width:100%;padding:10px;background:var(--acc);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}

/* 대기 화면 */
.pend-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;text-align:center;}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="auth-wrap on" id="loginView">
  <div class="logo">화강암<span>+</span></div>
  <div class="sub">미술학원 앱</div>
  <div class="card">
    <div class="card-title">로그인</div>
    <div class="amsg" id="loginMsg"></div>
    <div class="field"><label>이름</label><input type="text" id="loginName" placeholder="홍길동" autocomplete="name"></div>
    <div class="field"><label>비밀번호</label><input type="password" id="loginPw" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="abtn primary" onclick="doLogin()">로그인</button>
    <button class="link-btn" onclick="showAuth('signupView')">처음이신가요? 회원가입</button>
  </div>
</div>

<!-- 회원가입 -->
<div class="auth-wrap" id="signupView">
  <div class="logo">화강암<span>+</span></div>
  <div class="sub">회원가입</div>
  <div class="card">
    <div class="card-title">계정 만들기</div>
    <div class="amsg" id="signupMsg"></div>
    <div class="field"><label>이름</label><input type="text" id="signupName" placeholder="홍길동"></div>
    <div class="field"><label>반</label>
      <select id="signupCls"><option value="">반 선택</option><option>입시반</option><option>예비반</option><option>중등반</option><option>취미반</option></select>
    </div>
    <div class="field"><label>비밀번호 (4자 이상)</label><input type="password" id="signupPw" placeholder="••••"></div>
    <div class="field"><label>비밀번호 확인</label><input type="password" id="signupPw2" placeholder="••••" onkeydown="if(event.key==='Enter')doSignup()"></div>
    <button class="abtn primary" onclick="doSignup()">가입 신청</button>
    <button class="link-btn" onclick="showAuth('loginView')">이미 계정이 있어요</button>
  </div>
</div>

<!-- 승인 대기 -->
<div class="auth-wrap" id="pendingView">
  <div style="font-size:48px;margin-bottom:16px">⏳</div>
  <div style="font-size:18px;font-weight:700;margin-bottom:8px">승인 대기 중</div>
  <div style="font-size:14px;color:var(--tx2);line-height:1.7;margin-bottom:24px">원장님이 계정을 승인하면<br>자동으로 로그인됩니다.</div>
  <button class="abtn primary" style="max-width:220px" onclick="checkApproval()">승인 확인하기</button>
  <button class="link-btn" onclick="doLogout()">다른 계정으로</button>
</div>

<!-- 메인 앱 -->
<div class="app" id="appView">
  <div class="app-hdr">
    <div class="app-hdr-info">
      <div class="app-hdr-name" id="hdrName"></div>
      <div class="app-hdr-cls" id="hdrCls"></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>

  <div class="tab-content">
    <!-- 홈 -->
    <div class="tab-pane on" id="tab-home">
      <div class="sec-title">오늘 수업</div>
      <div id="todayCard"></div>
      <div class="sec-title">다음 수업</div>
      <div id="nextList"></div>
    </div>

    <!-- 시간표 -->
    <div class="tab-pane" id="tab-schedule">
      <div class="mon-nav">
        <button class="m-btn" onclick="moveMon(-1)">‹</button>
        <span class="mon-label" id="monLabel"></span>
        <button class="m-btn" onclick="moveMon(1)">›</button>
      </div>
      <div class="cal-hdr"><div class="cal-hd">일</div><div class="cal-hd">월</div><div class="cal-hd">화</div><div class="cal-hd">수</div><div class="cal-hd">목</div><div class="cal-hd">금</div><div class="cal-hd">토</div></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="stat-box" id="monthStats"></div>
      <div class="sec-title">수업 목록</div>
      <div id="classList"></div>
    </div>

    <!-- 공지 -->
    <div class="tab-pane" id="tab-notice">
      <div class="sec-title">공지사항</div>
      <div id="noticeList"></div>
      <div class="sec-title">과제</div>
      <div id="assignList"></div>
    </div>

    <!-- 갤러리 -->
    <div class="tab-pane" id="tab-gallery">
      <div class="sec-title">작품 갤러리</div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- 상담 -->
    <div class="tab-pane" id="tab-chat">
      <div class="sec-title">원장님께 문의</div>
      <div class="msg-thread" id="msgThread"></div>
      <div class="msg-input-wrap">
        <textarea class="msg-textarea" id="msgInput" placeholder="문의 내용을 입력하세요..."></textarea>
        <button class="msg-send" onclick="sendMsg()">보내기</button>
      </div>
    </div>
  </div>

  <!-- 탭 바 -->
  <div class="nav">
    <button class="nav-btn on" onclick="switchTab('home',this)"><span class="nav-icon">🏠</span>홈</button>
    <button class="nav-btn" onclick="switchTab('schedule',this)"><span class="nav-icon">📅</span>시간표</button>
    <button class="nav-btn" onclick="switchTab('notice',this)"><span class="nav-icon nav-badge">📢<span class="badge" id="noticeBadge" style="display:none"></span></span>공지</button>
    <button class="nav-btn" onclick="switchTab('gallery',this)"><span class="nav-icon">🎨</span>갤러리</button>
    <button class="nav-btn" onclick="switchTab('chat',this)"><span class="nav-icon nav-badge">💬<span class="badge" id="chatBadge" style="display:none"></span></span>상담</button>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="">
  <div class="lightbox-cap" id="lightboxCap"></div>
</div>

<script>
const DB='https://hwa1-c1ad9-default-rtdb.firebaseio.com';
const TIMES={'1':'10:00~13:30','2':'14:00~17:30','3':'18:30~22:00'};
const DAY=['일','월','화','수','목','금','토'];
let me=null, allSchedule={}, curY=new Date().getFullYear(), curM=new Date().getMonth()+1;

// ── 인증 ──
function showAuth(id){
  document.querySelectorAll('.auth-wrap').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
async function hashPw(pw,name){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+name+'hwagangam2024'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function makeUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

async function init(){
  const saved=localStorage.getItem('hwa_user');
  if(!saved){return;}
  try{
    const u=JSON.parse(saved);
    const r=await fetch(`${DB}/approved_users/${u.uid}.json`);
    const d=await r.json();
    if(d&&d.name===u.name){me=u;enterApp();}
    else{
      const r2=await fetch(`${DB}/pending_users/${u.uid}.json`);
      const pd=await r2.json();
      if(pd&&pd.name===u.name){me=u;showAuth('pendingView');}
      else{localStorage.removeItem('hwa_user');}
    }
  }catch(e){}
}

async function doLogin(){
  const name=document.getElementById('loginName').value.trim();
  const pw=document.getElementById('loginPw').value;
  const msg=document.getElementById('loginMsg');
  msg.className='amsg';
  if(!name||!pw){msg.className='amsg err';msg.textContent='이름과 비밀번호를 입력하세요.';return;}
  try{
    const r=await fetch(`${DB}/approved_users.json?_=${Date.now()}`);
    const all=r.ok?(await r.json()||{}):null;
    if(!all){msg.className='amsg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    const entries=Object.entries(all).filter(([_,u])=>u.name===name);
    if(!entries.length){msg.className='amsg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    let found=null;
    for(const [uid,u] of entries){
      if(u.pw===await hashPw(pw,name)){found={uid,...u};break;}
    }
    if(!found){msg.className='amsg err';msg.textContent='비밀번호가 틀렸습니다.';return;}
    me={uid:found.uid,name:found.name,cls:found.cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));
    enterApp();
  }catch(e){msg.className='amsg err';msg.textContent='오류가 발생했습니다.';}
}

async function doSignup(){
  const name=document.getElementById('signupName').value.trim();
  const cls=document.getElementById('signupCls').value;
  const pw=document.getElementById('signupPw').value;
  const pw2=document.getElementById('signupPw2').value;
  const msg=document.getElementById('signupMsg');
  msg.className='amsg';
  if(!name||!cls||!pw){msg.className='amsg err';msg.textContent='모든 항목을 입력하세요.';return;}
  if(pw.length<4){msg.className='amsg err';msg.textContent='비밀번호는 4자 이상이어야 합니다.';return;}
  if(pw!==pw2){msg.className='amsg err';msg.textContent='비밀번호가 일치하지 않습니다.';return;}
  try{
    const [ar,pr]=await Promise.all([fetch(`${DB}/approved_users.json?_=${Date.now()}`),fetch(`${DB}/pending_users.json?_=${Date.now()}`)]);
    const approved=ar.ok?(await ar.json()||{}):{};
    const pending=pr.ok?(await pr.json()||{}):{};
    if([...Object.values(approved),...Object.values(pending)].some(u=>u.name===name)){
      msg.className='amsg err';msg.textContent='이미 가입된 이름입니다.';return;
    }
    const uid=makeUid();
    await fetch(`${DB}/pending_users/${uid}.json`,{method:'PUT',body:JSON.stringify({name,cls,pw:await hashPw(pw,name),createdAt:new Date().toISOString()}),headers:{'Content-Type':'application/json'}});
    me={uid,name,cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));
    showAuth('pendingView');
  }catch(e){msg.className='amsg err';msg.textContent='오류가 발생했습니다.';}
}

async function checkApproval(){
  if(!me)return;
  const r=await fetch(`${DB}/approved_users/${me.uid}.json`);
  const d=await r.json();
  if(d&&d.name===me.name)enterApp();
  else alert('아직 승인 대기 중입니다.');
}

function doLogout(){localStorage.removeItem('hwa_user');me=null;location.reload();}

// ── 앱 진입 ──
async function enterApp(){
  document.querySelectorAll('.auth-wrap').forEach(v=>v.classList.remove('on'));
  document.getElementById('appView').classList.add('on');
  document.getElementById('hdrName').textContent=me.name;
  document.getElementById('hdrCls').textContent=me.cls;
  // 데이터 로드
  const r=await fetch(`${DB}/schedule_backup.json?_=${Date.now()}`);
  allSchedule=r.ok?(await r.json()||{}):{};
  renderHome();
  renderSchedule();
  loadNotices();
  loadGallery();
  loadChat();
}

// ── 탭 전환 ──
function switchTab(name,btn){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
  btn.classList.add('on');
}

// ── 시간표 헬퍼 ──
function getMyData(y,m){
  const key=`${me.cls}_${me.name}_${m}`;
  return allSchedule[key]||{};
}
function toDs(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

// ── 홈 ──
function renderHome(){
  const now=new Date();
  const m=now.getMonth()+1,d=now.getDate(),y=now.getFullYear();
  const dw=DAY[now.getDay()];
  const sd=getMyData(y,m);
  const reg=(sd.lessons||[]).filter(l=>l.day===d);
  const sp=(sd.special||[]).filter(l=>l.day===d);
  const tims=[...new Set([...reg.map(l=>l.tim),...sp.map(l=>l.tim)])].sort();

  const card=document.getElementById('todayCard');
  if(!tims.length){
    card.innerHTML=`<div class="today-card"><div class="today-hdr"><div class="t-dot off"></div><div><div class="t-date">${m}월 ${d}일 (${dw})</div><div class="t-status" style="color:var(--tx2)">오늘은 수업이 없어요</div></div></div></div>`;
  }else{
    const tHtml=tims.map(t=>{const isSp=sp.some(l=>l.tim===t)&&!reg.some(l=>l.tim===t);return `<div class="t-chip${isSp?' sp':''}"><div class="t-num">${t}타임</div><div class="t-range">${TIMES[String(t)]}</div>${isSp?'<span class="t-tag">특강</span>':''}</div>`;}).join('');
    card.innerHTML=`<div class="today-card active"><div class="today-hdr"><div class="t-dot"></div><div><div class="t-date">${m}월 ${d}일 (${dw})</div><div class="t-status">오늘 수업 ${tims.length}타임</div></div></div><div class="t-times">${tHtml}</div></div>`;
  }

  // 다음 수업 5개
  const todayStr=toDs(y,m,d);
  const upcoming=[];
  for(let mi=0;mi<2;mi++){
    const td=new Date(y,now.getMonth()+mi,1);
    const ty=td.getFullYear(),tm=td.getMonth()+1;
    const sd2=getMyData(ty,tm);
    const byDay={};
    [...(sd2.lessons||[]),...(sd2.special||[])].forEach(l=>{if(!byDay[l.day])byDay[l.day]={reg:[],sp:[]};if((sd2.lessons||[]).some(x=>x.day===l.day&&x.tim===l.tim))byDay[l.day].reg.push(l.tim);else byDay[l.day].sp.push(l.tim);});
    Object.keys(byDay).map(Number).sort((a,b)=>a-b).forEach(dd=>{if(toDs(ty,tm,dd)>todayStr)upcoming.push({ty,tm,dd,...byDay[dd]});});
  }
  const next5=upcoming.slice(0,5);
  const nl=document.getElementById('nextList');
  if(!next5.length){nl.innerHTML='<div class="empty-msg">예정된 수업이 없습니다</div>';return;}
  nl.innerHTML=next5.map(({ty,tm,dd,reg,sp})=>{
    const dw2=new Date(ty,tm-1,dd).getDay();
    const dwN=DAY[dw2],dwC=dw2===0?' sun':dw2===6?' sat':'';
    const tims2=[...new Set([...reg,...sp])].sort();
    const rows=tims2.map(t=>{const isSp=sp.includes(t)&&!reg.includes(t);return `${t}타임 ${TIMES[String(t)]}${isSp?'<span class="sp-badge">특강</span>':''}`;}).join('<br>');
    return `<div class="next-item"><div class="nd-box"><div class="nd-num">${dd}</div><div class="nd-name${dwC}">${tm}/${dd}<br>${dwN}</div></div><div class="nd-div"></div><div class="nd-info">${rows}</div></div>`;
  }).join('');
}

// ── 시간표 탭 ──
function renderSchedule(){
  const sd=getMyData(curY,curM);
  const reg=sd.lessons||[],sp=sd.special||[],absT=sd.abs||0;
  const regDays=new Set(reg.map(l=>l.day)),spDays=new Set(sp.map(l=>l.day));
  const now=new Date();
  const todayStr=toDs(now.getFullYear(),now.getMonth()+1,now.getDate());

  document.getElementById('monLabel').textContent=`${curY}년 ${curM}월`;

  // 달력
  const firstDay=new Date(curY,curM-1,1).getDay();
  const total=new Date(curY,curM,0).getDate();
  let html='';
  for(let i=0;i<firstDay;i++)html+=`<div class="c-day"></div>`;
  for(let d=1;d<=total;d++){
    const dw=new Date(curY,curM-1,d).getDay();
    const dk=toDs(curY,curM,d);
    const hasR=regDays.has(d),hasSp=spDays.has(d)&&!regDays.has(d);
    const has=hasR||hasSp;
    const cls=(has?' has':'')+(hasSp?' sp':'')+(dw===0?' sun':dw===6?' sat':'')+(dk===todayStr?' today-r':'');
    html+=`<div class="c-day${cls}">${d}${has?`<div class="c-dots">${hasR?'<div class="c-dot"></div>':''}${hasSp?'<div class="c-dot sp"></div>':''}</div>`:''}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;

  // 통계
  document.getElementById('monthStats').innerHTML=`
    <div class="s-row"><span class="s-lbl">정규</span><span class="s-val" style="color:var(--blue)">${reg.length}T</span></div>
    ${sp.length?`<div class="s-row"><span class="s-lbl">특강</span><span class="s-val" style="color:var(--yellow)">${sp.length}T</span></div>`:''}
    ${absT?`<div class="s-row"><span class="s-lbl">전월 결석</span><span class="s-val" style="color:var(--red)">-${absT}T</span></div>`:''}
    <div class="s-row"><span class="s-lbl">합계</span><span class="s-val">${reg.length+sp.length-absT}T</span></div>`;

  // 수업 목록
  const byDay={};
  [...reg,...sp].forEach(l=>{if(!byDay[l.day])byDay[l.day]={reg:[],sp:[]};if(reg.some(x=>x.day===l.day&&x.tim===l.tim))byDay[l.day].reg.push(l.tim);else byDay[l.day].sp.push(l.tim);});
  const days=Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  document.getElementById('classList').innerHTML=days.length?days.map(d=>{
    const dw=DAY[new Date(curY,curM-1,d).getDay()];
    const {reg:r,sp:s}=byDay[d];
    const tims=[...new Set([...r,...s])].sort();
    return `<div class="class-list-item"><div class="cli-date">${curM}/${d} (${dw})</div><div class="cli-time">${tims.map(t=>{const isSp=s.includes(t)&&!r.includes(t);return `${t}타임 ${TIMES[String(t)]}${isSp?' <span class="sp-badge">특강</span>':''}`;}).join('<br>')}</div></div>`;
  }).join(''):'<div class="empty-msg">이번달 수업이 없습니다</div>';
}
function moveMon(dir){curM+=dir;if(curM>12){curM=1;curY++;}if(curM<1){curM=12;curY--;}renderSchedule();}

// ── 공지사항 ──
async function loadNotices(){
  const [nr,ar]=await Promise.all([
    fetch(`${DB}/notices.json?_=${Date.now()}`),
    fetch(`${DB}/assignments.json?_=${Date.now()}`)
  ]);
  const notices=nr.ok?(await nr.json()||{}):{};
  const assigns=ar.ok?(await ar.json()||{}):{};

  // 공지 (전체 or 내 반)
  const myNotices=Object.entries(notices)
    .filter(([_,n])=>!n.cls||n.cls===me.cls||n.cls==='전체')
    .sort((a,b)=>new Date(b[1].createdAt)-new Date(a[1].createdAt));

  const nl=document.getElementById('noticeList');
  if(!myNotices.length){nl.innerHTML='<div class="empty-msg">공지사항이 없습니다</div>';}
  else{
    nl.innerHTML=myNotices.map(([id,n])=>{
      const isUrgent=n.urgent;
      const badgeCls=isUrgent?'urgent':n.cls&&n.cls!=='전체'?'cls':'all';
      const badgeText=isUrgent?'긴급':n.cls&&n.cls!=='전체'?n.cls:'전체';
      const date=new Date(n.createdAt).toLocaleDateString('ko',{month:'short',day:'numeric'});
      return `<div class="notice-item" onclick="toggleNotice(this)">
        <div class="ni-top"><span class="ni-badge ${badgeCls}">${badgeText}</span><span class="ni-date">${date}</span></div>
        <div class="ni-title">${n.title}</div>
        <div class="ni-body collapsed">${n.body}</div>
      </div>`;
    }).join('');
    // 새 공지 뱃지
    const newCount=myNotices.filter(([_,n])=>!localStorage.getItem('read_'+_)).length;
    if(newCount){document.getElementById('noticeBadge').textContent=newCount;document.getElementById('noticeBadge').style.display='block';}
  }

  // 과제
  const myAssigns=Object.entries(assigns)
    .filter(([_,a])=>!a.cls||a.cls===me.cls||a.cls==='전체')
    .sort((a,b)=>new Date(a[1].due)-new Date(b[1].due));
  const al=document.getElementById('assignList');
  if(!myAssigns.length){al.innerHTML='<div class="empty-msg">과제가 없습니다</div>';}
  else{
    const now=new Date();
    al.innerHTML=myAssigns.map(([_,a])=>{
      const due=new Date(a.due);
      const overdue=due<now;
      const dueStr=due.toLocaleDateString('ko',{month:'short',day:'numeric'});
      return `<div class="assign-item">
        <div class="ai-top"><div class="ai-title">${a.title}</div><div class="ai-due${overdue?' ok':''}">마감 ${dueStr}</div></div>
        <div class="ai-body">${a.body}</div>
      </div>`;
    }).join('');
  }
}

function toggleNotice(el){
  const body=el.querySelector('.ni-body');
  body.classList.toggle('collapsed');
  const id=el.dataset.id;
  if(id)localStorage.setItem('read_'+id,'1');
}

// ── 갤러리 ──
async function loadGallery(){
  const r=await fetch(`${DB}/gallery.json?_=${Date.now()}`);
  const data=r.ok?(await r.json()||{}):{};
  const items=Object.entries(data)
    .filter(([_,g])=>!g.cls||g.cls===me.cls||g.cls==='전체')
    .sort((a,b)=>new Date(b[1].createdAt)-new Date(a[1].createdAt));
  const grid=document.getElementById('galleryGrid');
  if(!items.length){grid.innerHTML='<div class="empty-msg" style="grid-column:1/-1">등록된 작품이 없습니다</div>';return;}
  grid.innerHTML=items.map(([_,g])=>
    `<div class="gallery-item" onclick="openLightbox('${g.url}','${g.caption||''}')">
      <img src="${g.url}" alt="${g.caption||''}" loading="lazy">
      ${g.caption?`<div class="gallery-label">${g.caption}</div>`:''}
    </div>`
  ).join('');
}

function openLightbox(url,cap){
  document.getElementById('lightboxImg').src=url;
  document.getElementById('lightboxCap').textContent=cap;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('on');}

// ── 상담 ──
async function loadChat(){
  const r=await fetch(`${DB}/messages/${me.uid}.json?_=${Date.now()}`);
  const data=r.ok?(await r.json()||{}):{};
  const msgs=Object.entries(data).sort((a,b)=>new Date(a[1].createdAt)-new Date(b[1].createdAt));
  const thread=document.getElementById('msgThread');
  if(!msgs.length){thread.innerHTML='<div class="empty-msg">원장님께 자유롭게 문의해주세요</div>';return;}
  thread.innerHTML=msgs.map(([_,m])=>{
    const isMine=m.from==='student';
    const time=new Date(m.createdAt).toLocaleString('ko',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div style="display:flex;flex-direction:column;align-items:${isMine?'flex-end':'flex-start'}">
      <div class="msg-bubble ${isMine?'mine':'theirs'}">${m.text}</div>
      <div class="msg-time ${isMine?'mine':''}">${time}</div>
    </div>`;
  }).join('');
  thread.scrollTop=thread.scrollHeight;
  // 새 답변 뱃지
  const unread=msgs.filter(([_,m])=>m.from==='admin'&&!m.read).length;
  if(unread){document.getElementById('chatBadge').textContent=unread;document.getElementById('chatBadge').style.display='block';}
}

async function sendMsg(){
  const text=document.getElementById('msgInput').value.trim();
  if(!text)return;
  const uid=Date.now().toString(36);
  await fetch(`${DB}/messages/${me.uid}/${uid}.json`,{
    method:'PUT',
    body:JSON.stringify({text,from:'student',name:me.name,cls:me.cls,createdAt:new Date().toISOString(),read:false}),
    headers:{'Content-Type':'application/json'}
  });
  document.getElementById('msgInput').value='';
  loadChat();
}

init();
</script>
