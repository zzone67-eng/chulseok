<title>화강암+ 미술학원</title>
<style>
:root{
  --bg:#F4F4F2;
  --sf:#FFFFFF;
  --sf2:#F8F8F6;
  --sf3:#EFEFED;
  --bd:#E8E7E3;
  --bd2:#D8D7D2;
  --tx:#161616;
  --tx2:#6E6E68;
  --tx3:#A4A49E;
  --red:#D83939;
  --blue:#2F6FED;
  --green:#2E9B62;
  --yellow:#D18C16;
  --purple:#7559C7;
  --acc:#D83939;
  --black:#111111;
  --shadow:0 8px 28px rgba(15,15,15,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#EDEDEA;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

/* auth */
.auth{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.auth.on{display:flex}
.auth-logo{font-size:30px;font-weight:900;letter-spacing:-1.5px;margin-bottom:5px}.auth-logo span{color:var(--acc)}
.auth-sub{font-size:13px;color:var(--tx3);margin-bottom:34px}
.auth-card{width:100%;max-width:360px;background:var(--sf);border:1px solid var(--bd);border-radius:28px;padding:28px 24px;box-shadow:var(--shadow)}
.auth-title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:22px}
.field{margin-bottom:14px}.field label{font-size:11px;font-weight:700;color:var(--tx2);display:block;margin-bottom:7px}
.field input,.field select{width:100%;padding:14px 15px;background:var(--sf2);border:1px solid var(--bd);border-radius:14px;color:var(--tx);font-size:15px;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--black);background:#fff}
.auth-btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--black);color:#fff;font-size:15px;font-weight:800;margin-top:5px}
.auth-link{background:none;border:0;color:var(--tx2);font-size:13px;margin:16px auto 0;display:block}
.auth-msg{font-size:13px;padding:10px 12px;border-radius:11px;margin-bottom:14px;display:none}.auth-msg.err{display:block;background:#FFF0F0;color:var(--red)}
.pend-wrap{text-align:center}

/* shell */
.app{display:none;width:100%;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);position:relative;flex-direction:column;overflow:hidden}
.app.on{display:flex}
.hdr{height:68px;flex:none;padding:12px 18px;display:flex;align-items:center;gap:10px;background:rgba(244,244,242,.92);backdrop-filter:blur(18px);z-index:10;border-bottom:1px solid rgba(0,0,0,0)}
.hdr.scrolled{border-bottom-color:var(--bd)}
.hdr-brand{display:flex;align-items:center;min-width:0;flex:1}.hdr-meta{min-width:0}.hdr-date{font-size:13px;font-weight:900;letter-spacing:-.25px;line-height:1.15}.hdr-user{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.hdr-logout{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);display:grid;place-items:center;color:var(--tx2)}
.hdr-logout svg{width:17px;height:17px}

// ── 인증 ──
function showAuth(id){document.querySelectorAll('.auth').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on');}
async function hashPw(pw,name){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+name+'hwagangam2024'));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function mkUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

async function init(){
  const s=localStorage.getItem('hwa_user');if(!s)return;
  try{
    const u=JSON.parse(s);
    const r=await fetch(`${DB}/approved_users/${u.uid}.json`);
    const d=await r.json();
    if(d&&d.name===u.name){me=u;enterApp();}
    else{
      const r2=await fetch(`${DB}/pending_users/${u.uid}.json`);
      const p=await r2.json();
      if(p&&p.name===u.name){me=u;showAuth('vPending');}
      else{localStorage.removeItem('hwa_user');}
    }
  }catch(e){}
}

async function doLogin(){

  const msg=document.getElementById('loginMsg');msg.className='auth-msg';
  if(!name||!pw){msg.className='auth-msg err';msg.textContent='이름과 비밀번호를 입력하세요.';return;}
  try{
    const r=await fetch(`${DB}/approved_users.json?_=${Date.now()}`);
    const all=r.ok?(await r.json()||{}):null;
    if(!all){msg.className='auth-msg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    const entries=Object.entries(all).filter(([_,u])=>u.name===name);
    if(!entries.length){msg.className='auth-msg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    let found=null;
    for(const [id,u] of entries){if(u.pw===await hashPw(pw,name)){found={uid:id,...u};break;}}
    if(!found){msg.className='auth-msg err';msg.textContent='비밀번호가 틀렸습니다.';return;}
    me={uid:found.uid,name:found.name,cls:found.cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));enterApp();
  }catch(e){msg.className='auth-msg err';msg.textContent='오류가 발생했습니다.';}
}

function myD(y,m){return sch[`${me.cls}_${me.name}_${m}`]||{};}
function ds(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

// ── 달력 렌더 ──
function renderCal(y,m,bodyId){
  const sd=myD(y,m);
  const reg=new Set((sd.lessons||[]).map(l=>l.day));
  const sp=new Set((sd.special||[]).filter(l=>!reg.has(l.day)).map(l=>l.day));
  const now=new Date(),ts=ds(now.getFullYear(),now.getMonth()+1,now.getDate());
  const first=new Date(y,m-1,1).getDay(),total=new Date(y,m,0).getDate();
  let h='';
  for(let i=0;i<first;i++)h+=`<div class="cd"></div>`;
  for(let d=1;d<=total;d++){
    const dw=new Date(y,m-1,d).getDay(),dk=ds(y,m,d);
    const isToday=dk===ts,hasR=reg.has(d),hasSp=sp.has(d);
    let cls='cd';
    if(isToday)cls+=' has today';
    else if(hasR)cls+=' has'+(dw===0?' sun':dw===6?' sat':'');
    else if(hasSp)cls+=' sp-only';
    h+=`<div class="${cls}">${d}${(hasR||hasSp||isToday)?'<div class="cd-dot"></div>':''}</div>`;
  }
  document.getElementById(bodyId).innerHTML=h;
}

function renderHome(){

  renderCal(calY,calM,'calBody');

  const now=new Date(),m=now.getMonth()+1,d=now.getDate(),y=now.getFullYear();
  const dw=DY[now.getDay()];
  const sd=myD(y,m);
  const reg=(sd.lessons||[]).filter(l=>l.day===d);
  const sp=(sd.special||[]).filter(l=>l.day===d);

  }else{

  }

  const todayStr=ds(y,m,d);
  const up=[];
  for(let mi=0;mi<3;mi++){
    const td=new Date(y,now.getMonth()+mi,1),ty=td.getFullYear(),tm=td.getMonth()+1;
    const sd2=myD(ty,tm);
    const bd={};
    [...(sd2.lessons||[]),...(sd2.special||[])].forEach(l=>{
      if(!bd[l.day])bd[l.day]={r:[],s:[]};
      if((sd2.lessons||[]).some(x=>x.day===l.day&&x.tim===l.tim))bd[l.day].r.push(l.tim);
      else bd[l.day].s.push(l.tim);
    });
    Object.keys(bd).map(Number).sort((a,b)=>a-b).forEach(dd=>{if(ds(ty,tm,dd)>todayStr)up.push({ty,tm,dd,...bd[dd]});});
  }
  const nl=document.getElementById('nextList');
  if(!up.length){nl.innerHTML='<div class="empty">예정된 수업이 없습니다</div>';return;}
  nl.innerHTML=up.slice(0,5).map(({ty,tm,dd,r,s})=>{
    const dw2=new Date(ty,tm-1,dd).getDay(),dwN=DY[dw2],dwC=dw2===0?' sun':dw2===6?' sat':'';
    const ts2=[...new Set([...r,...s])].sort();
    const rows=ts2.map(t=>{const isSp=s.includes(t)&&!r.includes(t);return `${t}타임 ${TM[String(t)]}${isSp?'<span class="sp-pip">특강</span>':''}`;}).join('<br>');
    return `<div class="next-item"><div class="ni-date-col"><div class="ni-day-num">${dd}</div><div class="ni-day-label${dwC}">${tm}/${dd}<br>${dwN}</div></div><div class="ni-sep"></div><div class="ni-times">${rows}</div></div>`;
  }).join('');

// ── 오늘의 미션 ──
function todayKey(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function getMissionPool(){
  return missionPools[me?.cls]||missionPools['예비반'];
}
function getMissionIndex(){
  const pool=getMissionPool();
  const n=new Date();
  const start=new Date(n.getFullYear(),0,1);
  const base=Math.floor((n-start)/86400000);
  const uidSeed=[...(me?.uid||'')].reduce((a,c)=>a+c.charCodeAt(0),0);
  return (base+uidSeed)%pool.length;
}
function getMissionStore(){
  return JSON.parse(localStorage.getItem('hwa_missions_'+me.uid)||'{"completed":[]}');
}
function calcStreak(completed){
  const dates=[...new Set(completed)].sort();
  if(!dates.length) return 0;
  let streak=0;
  let cursor=new Date();
  cursor.setHours(0,0,0,0);
  while(true){
    const key=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
    if(dates.includes(key)){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }else break;
  }
  return streak;
}
function loadMission(){
  if(!me||!document.getElementById('missionTitle')) return;
  const pool=getMissionPool();
  const mission=pool[getMissionIndex()];
  const store=getMissionStore();
  const tk=todayKey();
  const done=(store.completed||[]).includes(tk);
  const streak=calcStreak(store.completed||[]);
  document.getElementById('missionLabel').textContent='랜덤 과제';
  document.getElementById('missionTitle').textContent=mission.title;
  document.getElementById('missionDesc').textContent=mission.desc;
  document.getElementById('missionStreak').textContent=`🔥 ${streak}일`;
  const card=document.getElementById('missionCard');
  card.classList.toggle('done', done);
  const btn=document.getElementById('missionBtn');
  btn.textContent=done?'완료':'완료';
  btn.className='mission-btn'+(done?' done':'');
}
function completeMission(){
  haptic('medium');
  const store=getMissionStore();
  store.completed=store.completed||[];
  const tk=todayKey();
  if(!store.completed.includes(tk)) store.completed.push(tk);
  localStorage.setItem('hwa_missions_'+me.uid, JSON.stringify(store));
  loadMission();
  showToast('오늘의 드로잉 미션 완료!','ok');
}

async function loadNotices(){
  const [nr,ar]=await Promise.all([fetch(`${DB}/notices.json?_=${Date.now()}`),fetch(`${DB}/assignments.json?_=${Date.now()}`)]);
  ntcData=nr.ok?(await nr.json()||{}):{};

  const myN=Object.entries(ntcData).filter(([_,n])=>!n.cls||n.cls===me.cls||n.cls==='전체').sort((a,b)=>new Date(b[1].createdAt)-new Date(a[1].createdAt));
  if(myN.length){
    const latest=myN[0][1];
    const bar=document.getElementById('noticeBanner');bar.classList.add('show');
    document.getElementById('nbTxt').textContent=(latest.urgent?'🚨 ':'📢 ')+latest.title;
  }
  const unread=myN.filter(([id])=>!localStorage.getItem('nr_'+id)).length;
  if(unread){const b=document.getElementById('nbadge');b.textContent=unread;b.style.display='block';}
  filterNtc('all');
}
function filterNtc(type,btn){
  if(btn){document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
  const cont=document.getElementById('ntcContent');
  let html='';
  if(type==='all'||type==='notice'){
    const notices=Object.entries(ntcData).filter(([_,n])=>!n.cls||n.cls===me.cls||n.cls==='전체').sort((a,b)=>new Date(b[1].createdAt)-new Date(a[1].createdAt));
    if(type==='all'&&notices.length)html+=`<div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;margin-bottom:8px">공지사항</div>`;
    html+=notices.map(([id,n])=>{
      const bc=n.urgent?'nb-hot':n.cls&&n.cls!=='전체'?'nb-cls':'nb-all';
      const bt=n.urgent?'긴급':n.cls&&n.cls!=='전체'?n.cls:'전체';
      const dt=new Date(n.createdAt).toLocaleDateString('ko',{month:'short',day:'numeric'});
      return `<div class="ntc-card" onclick="this.querySelector('.ntc-body').classList.toggle('clamp');localStorage.setItem('nr_${id}','1')"><div class="ntc-top"><span class="ntc-badge ${bc}">${bt}</span><span class="ntc-date">${dt}</span></div><div class="ntc-title">${n.title}</div><div class="ntc-body clamp">${n.body}</div></div>`;
    }).join('');
    if(!notices.length&&type==='notice')html='<div class="empty">공지사항이 없습니다</div>';
  }
  if(type==='all'||type==='assign'){
    const assigns=Object.entries(asnData).filter(([_,a])=>!a.cls||a.cls===me.cls||a.cls==='전체').sort((a,b)=>new Date(a[1].due)-new Date(b[1].due));
    if(type==='all'&&assigns.length)html+=`<div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;margin:16px 0 8px">과제</div>`;
    const now=new Date();
    html+=assigns.map(([_,a])=>{const ov=new Date(a.due)<now,ds2=new Date(a.due).toLocaleDateString('ko',{month:'short',day:'numeric'});
      return `<div class="asgn-card"><div class="asgn-top"><div class="asgn-ttl">${a.title}</div><div class="asgn-due${ov?' past':''}">마감 ${ds2}</div></div><div class="asgn-body">${a.body}</div></div>`;}).join('');
    if(!assigns.length&&type==='assign')html='<div class="empty">과제가 없습니다</div>';
  }
  if(!html)html='<div class="empty">내용이 없습니다</div>';
  cont.innerHTML=html;
  setTimeout(initNtcCards,100);
}

    grid.innerHTML='<div class="empty" style="grid-column:1/-1;font-size:13px;padding:16px 0">아직 작품이 없어요<br><span style="color:var(--tx3);font-size:12px">+ 추가로 사진을 업로드해보세요</span></div>';
    return;
  }
  grid.innerHTML=photos.map((p,i)=>`
    <div class="gal-item">
      <img src="${p.url}" loading="lazy" onclick="openLb('${p.url}','${(p.caption||'').replace(/'/g,'`')}')">
      ${p.caption?`<div class="gal-cap">${p.caption}</div>`:''}
      <button onclick="deleteMyPhoto(${i})" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">✕</button>
    </div>`).join('');
}

function addMyPhotos(input){
  const files=Array.from(input.files);
  if(!files.length)return;
  let done=0;
  const photos=JSON.parse(localStorage.getItem('hwa_photos_'+me.uid)||'[]');
  files.forEach(file=>{
    if(!file.type.startsWith('image/')){done++;return;}
    // 이미지 리사이즈 후 base64 저장
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1200;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const url=canvas.toDataURL('image/jpeg',0.82);
        photos.unshift({url,caption:'',createdAt:new Date().toISOString()});
        done++;
        if(done===files.length){
          localStorage.setItem('hwa_photos_'+me.uid,JSON.stringify(photos));
          loadMyGallery();
          showToast('사진 '+files.length+'장 추가됐습니다 🎨','ok');
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}

function deleteMyPhoto(i){
  haptic('medium');
  if(!confirm('이 사진을 삭제할까요?'))return;
  const photos=JSON.parse(localStorage.getItem('hwa_photos_'+me.uid)||'[]');
  photos.splice(i,1);
  localStorage.setItem('hwa_photos_'+me.uid,JSON.stringify(photos));
  loadMyGallery();
  showToast('삭제됐습니다','');
}

// ── 상담 ──
async function loadChat(){
  const r=await fetch(`${DB}/messages/${me.uid}.json?_=${Date.now()}`);
  const data=r.ok?(await r.json()||{}):{};
  const msgs=Object.entries(data).sort((a,b)=>new Date(a[1].createdAt)-new Date(b[1].createdAt));
  const bw=document.getElementById('chatMsgs');
  if(!msgs.length){bw.innerHTML='<div class="empty">원장님께 자유롭게 문의해주세요 😊</div>';return;}
  bw.innerHTML=msgs.map(([_,m])=>{
    const mine=m.from==='student';
    const t=new Date(m.createdAt).toLocaleString('ko',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="bubble-row ${mine?'me':'them'}"><div class="bubble ${mine?'me':'them'}">${m.text}</div><div class="btime${mine?' me':''}">${t}</div></div>`;
  }).join('');
  bw.scrollTop=bw.scrollHeight;
  const unread=msgs.filter(([_,m])=>m.from==='admin'&&!m.read).length;
  if(unread){const b=document.getElementById('cbadge');b.textContent=unread;b.style.display='block';}
}
async function sendMsg(){
  haptic('medium');
  const ta=document.getElementById('chatInput');const text=ta.value.trim();if(!text)return;
  await fetch(`${DB}/messages/${me.uid}/${Date.now().toString(36)}.json`,{method:'PUT',body:JSON.stringify({text,from:'student',name:me.name,cls:me.cls,createdAt:new Date().toISOString(),read:false}),headers:{'Content-Type':'application/json'}});
  ta.value='';ta.style.height='auto';loadChat();
  showToast('전송됐습니다','ok');
}

// ── 토스트 ──
let toastTimer=null;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(type?' '+type:'');
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>{t.classList.add('show');});
  toastTimer=setTimeout(()=>{t.classList.remove('show');},2200);
}

// ── 햅틱 ──
function haptic(type='light'){
  if(navigator.vibrate){
    navigator.vibrate(type==='light'?8:type==='medium'?20:50);
  }
}

// ── 달력 날짜 클릭 → 바텀시트 ──
function openDaySheet(y,m,d){
  haptic('light');
  const dw=['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  const sd=myD(y,m);
  const reg=(sd.lessons||[]).filter(l=>l.day===d);
  const sp=(sd.special||[]).filter(l=>l.day===d);
  const tims=[...new Set([...reg.map(l=>l.tim),...sp.map(l=>l.tim)])].sort();
  document.getElementById('bsDate').textContent=`${m}월 ${d}일 (${dw})`;
  document.getElementById('bsContent').innerHTML=tims.length
    ?tims.map(t=>{const isSp=sp.some(l=>l.tim===t)&&!reg.some(l=>l.tim===t);return `<div class="bs-chip${isSp?' sp':''}"><div class="bs-tnum">${t}타임</div><div class="bs-trange">${TM[String(t)]}</div>${isSp?'<span class="bs-stag">특강</span>':''}</div>`;}).join('')
    :'<div class="bs-empty">수업 없음</div>';
  document.getElementById('daySheet').classList.add('on');
}
function closeDaySheet(){document.getElementById('daySheet').classList.remove('on');}

// ── 스와이프로 달력 이동 ──
let swipeStartX=0,swipeStartY=0;
function initSwipe(){
  const scr=document.getElementById('mainScr');
  scr.addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;},{passive:true});
  scr.addEventListener('touchend',e=>{
    if(!document.getElementById('pane-home').classList.contains('on'))return;
    const dx=e.changedTouches[0].clientX-swipeStartX;
    const dy=Math.abs(e.changedTouches[0].clientY-swipeStartY);
    if(Math.abs(dx)>60&&dy<40){
      if(dx<0)moveCal(1);else moveCal(-1);
    }
  },{passive:true});
}

// ── 헤더 스크롤 감지 ──
function initScrollHeader(){
  const scr=document.getElementById('mainScr');
  const hdr=document.querySelector('.hdr');
  scr.addEventListener('scroll',()=>{
    hdr.classList.toggle('scrolled',scr.scrollTop>10);
  },{passive:true});
}

// ── 달력 클릭 이벤트 위임 ──
function initCalClick(){
  ['calBody','schCalBody'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('click',e=>{
      const cd=e.target.closest('.cd.has');if(!cd)return;
      const cells=[...el.querySelectorAll('.cd')];
      const idx=cells.indexOf(cd);
      const first=new Date(calY,calM-1,1).getDay();
      const d=idx-first+1;
      if(d<1)return;
      const y=id==='calBody'?calY:schY;
      const m=id==='calBody'?calM:schM;
      openDaySheet(y,m,d);
    });
  });
}







// ── 다음 수업 카드 클릭 → 펼치기 ──
function initNextExpand(){
  document.getElementById('nextList').addEventListener('click',e=>{
    const item=e.target.closest('.next-item');if(!item)return;
    haptic('light');
    item.classList.toggle('expanded');
    const times=item.querySelector('.ni-times');
    if(times){
      times.style.maxHeight=item.classList.contains('expanded')?times.scrollHeight+'px':'60px';
    }
  });
}


function initNtcCards(){
  document.querySelectorAll('.ntc-card').forEach(card=>{
    card.addEventListener('click',()=>{
      haptic('light');
      if(!card.classList.contains('read')){
        setTimeout(()=>card.classList.add('read'),200);
      }
    });
  });
}







// ── 초기화 ──
window.addEventListener('DOMContentLoaded',()=>{
  initSwipe();
  initScrollHeader();
  setTimeout(()=>{initCalClick();initNextExpand();},500);
});

init();
