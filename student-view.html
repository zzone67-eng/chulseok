<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화강암+ 수업 일정</title>
<style>
:root{
  --bg:#0F0F12; --sf:#1A1A1F; --sf2:#242428;
  --bd:#2C2C33; --bd2:#38383F;
  --tx:#E8E6E0; --tx2:#8A8880; --tx3:#46464E;
  --red:#C94040; --blue:#4A8FD4; --green:#3AA86A; --yellow:#C8940A;
  --acc:#C94040;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.view{display:none;min-height:100vh;}
.view.on{display:flex;}
.center{flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}

/* 로그인/가입 */
.logo{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.logo span{color:var(--acc);}
.sub{font-size:13px;color:var(--tx2);margin-bottom:36px;}
.card{width:100%;max-width:340px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:18px;}
.field{margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;color:var(--tx3);display:block;margin-bottom:5px;letter-spacing:.06em;}
.field input,.field select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--acc);}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.btn.primary{background:var(--acc);color:#fff;}
.btn.ghost{background:transparent;color:var(--tx2);margin-top:8px;border:1px solid var(--bd);}
.link-btn{background:none;border:none;color:var(--tx2);font-size:13px;cursor:pointer;margin-top:14px;display:block;text-align:center;text-decoration:underline;}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px;display:none;}
.msg.err{background:#2A1515;color:#E06060;display:block;}
.msg.ok{background:#152A1E;color:var(--green);display:block;}

/* 대기 */
.pend-icon{font-size:48px;margin-bottom:16px;}
.pend-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.pend-desc{font-size:14px;color:var(--tx2);text-align:center;line-height:1.7;margin-bottom:24px;max-width:260px;}

/* 메인 */
.main-view{flex-direction:column;max-width:480px;margin:0 auto;width:100%;padding-bottom:40px;}

/* 헤더 */
.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
.hdr-info{flex:1;}
.hdr-name{font-size:16px;font-weight:700;}
.hdr-cls{font-size:12px;color:var(--tx2);margin-top:1px;}
.logout-btn{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:12px;padding:5px 10px;cursor:pointer;}

/* 오늘 카드 */
.today-section{padding:20px 16px 0;}
.today-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;}
.today-card.has-class{border-color:var(--blue);background:linear-gradient(135deg,#0E1E35 0%,var(--sf) 100%);}
.today-card.no-class{opacity:.7;}
.today-hdr{padding:16px 18px 12px;display:flex;align-items:center;gap:10px;}
.today-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.today-dot.off{background:var(--tx3);}
.today-date{font-size:13px;color:var(--tx2);}
.today-status{font-size:17px;font-weight:700;margin-top:2px;}
.today-times{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px;}
.time-chip{background:rgba(74,143,212,.12);border:1px solid rgba(74,143,212,.25);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.time-chip.sp{background:rgba(200,148,10,.1);border-color:rgba(200,148,10,.25);}
.time-num{font-size:13px;font-weight:700;color:var(--blue);}
.time-chip.sp .time-num{color:var(--yellow);}
.time-range{font-size:12px;color:var(--tx2);}
.time-tag{font-size:10px;font-weight:700;background:#2A1F0A;color:var(--yellow);border-radius:4px;padding:2px 6px;margin-left:auto;}

/* 다음 수업 */
.next-section{padding:20px 16px 0;}
.sec-label{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.08em;margin-bottom:10px;}
.next-item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.next-date-box{text-align:center;min-width:40px;}
.next-day-num{font-size:20px;font-weight:800;line-height:1;}
.next-day-name{font-size:11px;color:var(--tx2);margin-top:2px;}
.next-day-name.sun{color:var(--red);}
.next-day-name.sat{color:var(--blue);}
.next-divider{width:1px;height:36px;background:var(--bd);}
.next-times{flex:1;}
.next-time-row{font-size:13px;color:var(--tx2);line-height:1.8;}
.d-badge{display:inline;background:rgba(74,143,212,.15);color:var(--blue);font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:6px;}
.d-badge.sp{background:rgba(200,148,10,.15);color:var(--yellow);}

/* 월 수업 요약 */
.month-section{padding:20px 16px 0;}
.month-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;}
.month-hdr{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.month-title{font-size:14px;font-weight:700;}
.month-nav{display:flex;gap:6px;align-items:center;}
.m-btn{background:none;border:1px solid var(--bd);border-radius:6px;color:var(--tx2);padding:4px 10px;cursor:pointer;font-size:14px;}
.month-label{font-size:13px;font-weight:600;color:var(--tx2);}
.month-body{padding:14px 16px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);}
.stat-row:last-child{border:none;padding-top:10px;}
.stat-lbl{font-size:13px;color:var(--tx2);}
.stat-val{font-size:14px;font-weight:700;}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:14px;}
.mc-hd{font-size:10px;text-align:center;color:var(--tx3);padding:2px 0;font-weight:600;}
.mc-hd:first-child{color:var(--red);}
.mc-hd:last-child{color:var(--blue);}
.mc-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx3);}
.mc-day.has{background:rgba(74,143,212,.18);color:var(--blue);font-weight:600;}
.mc-day.has.sp{background:rgba(200,148,10,.15);color:var(--yellow);}
.mc-day.today-mark{outline:2px solid var(--acc);outline-offset:-2px;border-radius:6px;}
.mc-day.sun{color:var(--red);}
.mc-day.sat{color:var(--blue);}
.mc-day.has.sun,.mc-day.has.sat{color:inherit;}
</style>
</head>
<body>

<div class="view on center" id="loginView">
  <div class="logo">화강암<span>+</span></div>
  <div class="sub">수업 일정 조회</div>
  <div class="card">
    <div class="card-title">로그인</div>
    <div class="msg" id="loginMsg"></div>
    <div class="field"><label>이름</label><input type="text" id="loginName" placeholder="홍길동" autocomplete="name"></div>
    <div class="field"><label>비밀번호</label><input type="password" id="loginPw" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn primary" onclick="doLogin()">로그인</button>
    <button class="link-btn" onclick="showView('signupView')">처음이신가요? 회원가입</button>
  </div>
</div>

<div class="view center" id="signupView">
  <div class="logo">화강암<span>+</span></div>
  <div class="sub">회원가입</div>
  <div class="card">
    <div class="card-title">계정 만들기</div>
    <div class="msg" id="signupMsg"></div>
    <div class="field"><label>이름</label><input type="text" id="signupName" placeholder="홍길동"></div>
    <div class="field"><label>반</label>
      <select id="signupCls">
        <option value="">반 선택</option>
        <option>입시반</option><option>예비반</option><option>중등반</option><option>취미반</option>
      </select>
    </div>
    <div class="field"><label>비밀번호 (4자 이상)</label><input type="password" id="signupPw" placeholder="••••"></div>
    <div class="field"><label>비밀번호 확인</label><input type="password" id="signupPw2" placeholder="••••" onkeydown="if(event.key==='Enter')doSignup()"></div>
    <button class="btn primary" onclick="doSignup()">가입 신청</button>
    <button class="link-btn" onclick="showView('loginView')">이미 계정이 있어요</button>
  </div>
</div>

<div class="view center" id="pendingView">
  <div class="pend-icon">⏳</div>
  <div class="pend-title">승인 대기 중</div>
  <div class="pend-desc">원장님이 계정을 승인하면<br>자동으로 로그인됩니다.</div>
  <button class="btn primary" style="max-width:220px" onclick="checkApproval()">승인 확인하기</button>
  <button class="link-btn" onclick="doLogout()">다른 계정으로 로그인</button>
</div>

<div class="view main-view" id="mainView">
  <div class="hdr">
    <div class="hdr-info">
      <div class="hdr-name" id="hdrName"></div>
      <div class="hdr-cls" id="hdrCls"></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 오늘 -->
  <div class="today-section">
    <div id="todayCard"></div>
  </div>

  <!-- 다음 수업 -->
  <div class="next-section">
    <div class="sec-label">다음 수업</div>
    <div id="nextList"></div>
  </div>

  <!-- 월 요약 -->
  <div class="month-section">
    <div class="month-card">
      <div class="month-hdr">
        <div class="month-title" id="monthTitle">이번달 수업</div>
        <div class="month-nav">
          <button class="m-btn" onclick="moveMon(-1)">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button class="m-btn" onclick="moveMon(1)">›</button>
        </div>
      </div>
      <div class="month-body">
        <div id="monthStats"></div>
        <div class="mini-cal" id="miniCal"></div>
      </div>
    </div>
  </div>
</div>

<script>
const DB='https://hwa1-c1ad9-default-rtdb.firebaseio.com';
const TIMES={'1':'10:00~13:30','2':'14:00~17:30','3':'18:30~22:00'};
const DAY=['일','월','화','수','목','금','토'];
let me=null;
let curY=new Date().getFullYear(), curM=new Date().getMonth()+1;
let allSchedule={};

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on');}

async function hashPw(pw,name){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+name+'hwagangam2024'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function makeUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

async function init(){
  const saved=localStorage.getItem('hwa_user');
  if(!saved){showView('loginView');return;}
  try{
    const u=JSON.parse(saved);
    const r=await fetch(`${DB}/approved_users/${u.uid}.json`);
    const d=await r.json();
    if(d&&d.name===u.name){me=u;enterMain();}
    else{
      const r2=await fetch(`${DB}/pending_users/${u.uid}.json`);
      const pd=await r2.json();
      if(pd&&pd.name===u.name){me=u;showView('pendingView');}
      else{localStorage.removeItem('hwa_user');showView('loginView');}
    }
  }catch(e){showView('loginView');}
}

async function doLogin(){
  const name=document.getElementById('loginName').value.trim();
  const pw=document.getElementById('loginPw').value;
  const msg=document.getElementById('loginMsg');
  msg.className='msg';
  if(!name||!pw){msg.className='msg err';msg.textContent='이름과 비밀번호를 입력하세요.';return;}
  try{
    const r=await fetch(`${DB}/approved_users.json?_=${Date.now()}`);
    const all=r.ok?(await r.json()||{}):null;
    if(!all){msg.className='msg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    const entries=Object.entries(all).filter(([_,u])=>u.name===name);
    if(!entries.length){msg.className='msg err';msg.textContent='승인되지 않은 계정입니다.';return;}
    let found=null;
    for(const [uid,u] of entries){
      if(u.pw===await hashPw(pw,name)){found={uid,...u};break;}
    }
    if(!found){msg.className='msg err';msg.textContent='비밀번호가 틀렸습니다.';return;}
    me={uid:found.uid,name:found.name,cls:found.cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));
    enterMain();
  }catch(e){msg.className='msg err';msg.textContent='오류가 발생했습니다.';}
}

async function doSignup(){
  const name=document.getElementById('signupName').value.trim();
  const cls=document.getElementById('signupCls').value;
  const pw=document.getElementById('signupPw').value;
  const pw2=document.getElementById('signupPw2').value;
  const msg=document.getElementById('signupMsg');
  msg.className='msg';
  if(!name||!cls||!pw){msg.className='msg err';msg.textContent='모든 항목을 입력하세요.';return;}
  if(pw.length<4){msg.className='msg err';msg.textContent='비밀번호는 4자 이상이어야 합니다.';return;}
  if(pw!==pw2){msg.className='msg err';msg.textContent='비밀번호가 일치하지 않습니다.';return;}
  try{
    const [ar,pr]=await Promise.all([
      fetch(`${DB}/approved_users.json?_=${Date.now()}`),
      fetch(`${DB}/pending_users.json?_=${Date.now()}`)
    ]);
    const approved=ar.ok?(await ar.json()||{}):{};
    const pending=pr.ok?(await pr.json()||{}):{};
    if([...Object.values(approved),...Object.values(pending)].some(u=>u.name===name)){
      msg.className='msg err';msg.textContent='이미 가입된 이름입니다. 로그인해주세요.';return;
    }
    const uid=makeUid();
    const hash=await hashPw(pw,name);
    await fetch(`${DB}/pending_users/${uid}.json`,{method:'PUT',body:JSON.stringify({name,cls,pw:hash,createdAt:new Date().toISOString()}),headers:{'Content-Type':'application/json'}});
    me={uid,name,cls};
    localStorage.setItem('hwa_user',JSON.stringify(me));
    showView('pendingView');
  }catch(e){msg.className='msg err';msg.textContent='오류가 발생했습니다.';}
}

async function checkApproval(){
  if(!me)return;
  const r=await fetch(`${DB}/approved_users/${me.uid}.json`);
  const d=await r.json();
  if(d&&d.name===me.name)enterMain();
  else alert('아직 승인 대기 중입니다. 원장님께 문의하세요.');
}

function doLogout(){localStorage.removeItem('hwa_user');me=null;showView('loginView');}

async function enterMain(){
  document.getElementById('hdrName').textContent=me.name;
  document.getElementById('hdrCls').textContent=me.cls;
  showView('mainView');
  // schedule_backup 로드
  const r=await fetch(`${DB}/schedule_backup.json?_=${Date.now()}`);
  allSchedule=r.ok?(await r.json()||{}):{};
  renderAll();
}

function getMyLessons(y,m){
  const key=`${me.cls}_${me.name}_${m}`;
  // m이 숫자이므로 key 찾기
  const found=Object.keys(allSchedule).find(k=>k===key||k===`${me.cls}_${me.name}_${m}`);
  return allSchedule[found]||{};
}

function toDateStr(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

function renderAll(){
  const now=new Date();
  const todayStr=toDateStr(now.getFullYear(),now.getMonth()+1,now.getDate());
  renderToday(now,todayStr);
  renderNext(now,todayStr);
  renderMonth();
}

function renderToday(now,todayStr){
  const m=now.getMonth()+1, d=now.getDate(), y=now.getFullYear();
  const dw=DAY[now.getDay()];
  const sdata=getMyLessons(y,m);
  const reg=(sdata.lessons||[]).filter(l=>l.day===d);
  const sp=(sdata.special||[]).filter(l=>l.day===d);
  const allTims=[...new Set([...reg.map(l=>l.tim),...sp.map(l=>l.tim)])].sort();
  const hasClass=allTims.length>0;

  const card=document.getElementById('todayCard');
  if(!hasClass){
    card.innerHTML=`<div class="today-card no-class">
      <div class="today-hdr">
        <div class="today-dot off"></div>
        <div><div class="today-date">${m}월 ${d}일 (${dw})</div><div class="today-status" style="color:var(--tx2)">오늘은 수업이 없어요</div></div>
      </div>
    </div>`;
    return;
  }

  const timesHtml=allTims.map(t=>{
    const isSp=sp.some(l=>l.tim===t)&&!reg.some(l=>l.tim===t);
    return `<div class="time-chip${isSp?' sp':''}">
      <div class="time-num">${t}타임</div>
      <div class="time-range">${TIMES[String(t)]||''}</div>
      ${isSp?'<span class="time-tag">특강</span>':''}
    </div>`;
  }).join('');

  card.innerHTML=`<div class="today-card has-class">
    <div class="today-hdr">
      <div class="today-dot"></div>
      <div><div class="today-date">${m}월 ${d}일 (${dw})</div><div class="today-status">오늘 수업 ${allTims.length}타임</div></div>
    </div>
    <div class="today-times">${timesHtml}</div>
  </div>`;
}

function renderNext(now,todayStr){
  const list=document.getElementById('nextList');
  const upcoming=[];
  // 이번달 + 다음달 탐색
  for(let mi=0;mi<2;mi++){
    const td=new Date(now.getFullYear(),now.getMonth()+mi,1);
    const y=td.getFullYear(),m=td.getMonth()+1;
    const sdata=getMyLessons(y,m);
    const byDay={};
    [...(sdata.lessons||[]),...(sdata.special||[])].forEach(l=>{
      if(!byDay[l.day])byDay[l.day]={reg:[],sp:[]};
      if(sdata.lessons?.some(x=>x.day===l.day&&x.tim===l.tim))byDay[l.day].reg.push(l.tim);
      else byDay[l.day].sp.push(l.tim);
    });
    Object.keys(byDay).map(Number).sort((a,b)=>a-b).forEach(d=>{
      const dk=toDateStr(y,m,d);
      if(dk>todayStr)upcoming.push({y,m,d,dk,...byDay[d]});
    });
  }

  const next5=upcoming.slice(0,5);
  if(!next5.length){list.innerHTML='<div style="color:var(--tx3);font-size:13px;padding:10px 0">예정된 수업이 없습니다</div>';return;}

  list.innerHTML=next5.map(({y,m,d,reg,sp})=>{
    const dw=new Date(y,m-1,d).getDay();
    const dwName=DAY[dw];
    const dwCls=dw===0?'sun':dw===6?'sat':'';
    const allTims=[...new Set([...reg,...sp])].sort();
    const timRows=allTims.map(t=>{
      const isSp=sp.includes(t)&&!reg.includes(t);
      return `${t}타임 ${TIMES[String(t)]||''}${isSp?'<span class="d-badge sp">특강</span>':''}`;
    }).join('<br>');
    return `<div class="next-item">
      <div class="next-date-box">
        <div class="next-day-num">${d}</div>
        <div class="next-day-name ${dwCls}">${m}/${d}<br>${dwName}</div>
      </div>
      <div class="next-divider"></div>
      <div class="next-times"><div class="next-time-row">${timRows}</div></div>
    </div>`;
  }).join('');
}

function renderMonth(){
  const sdata=getMyLessons(curY,curM);
  const reg=sdata.lessons||[], sp=sdata.special||[];
  const absT=sdata.abs||0;
  const regDays=new Set(reg.map(l=>l.day));
  const spDays=new Set(sp.map(l=>l.day));

  document.getElementById('monthLabel').textContent=`${curM}월`;
  document.getElementById('monthTitle').textContent=`${curM}월 수업`;

  // 통계
  document.getElementById('monthStats').innerHTML=`
    <div class="stat-row"><span class="stat-lbl">정규</span><span class="stat-val" style="color:var(--blue)">${reg.length}T</span></div>
    ${sp.length?`<div class="stat-row"><span class="stat-lbl">특강</span><span class="stat-val" style="color:var(--yellow)">${sp.length}T</span></div>`:''}
    ${absT?`<div class="stat-row"><span class="stat-lbl">전월 결석</span><span class="stat-val" style="color:var(--red)">-${absT}T</span></div>`:''}
    <div class="stat-row"><span class="stat-lbl">합계</span><span class="stat-val">${reg.length+sp.length-absT}T</span></div>`;

  // 미니 달력
  const cal=document.getElementById('miniCal');
  const now=new Date();
  const todayStr=toDateStr(now.getFullYear(),now.getMonth()+1,now.getDate());
  const firstDay=new Date(curY,curM-1,1).getDay();
  const totalDays=new Date(curY,curM,0).getDate();

  let html=`<div class="mc-hd">일</div><div class="mc-hd">월</div><div class="mc-hd">화</div><div class="mc-hd">수</div><div class="mc-hd">목</div><div class="mc-hd">금</div><div class="mc-hd">토</div>`;
  for(let i=0;i<firstDay;i++)html+=`<div class="mc-day"></div>`;
  for(let d=1;d<=totalDays;d++){
    const dw=new Date(curY,curM-1,d).getDay();
    const dk=toDateStr(curY,curM,d);
    const hasReg=regDays.has(d),hasSp=spDays.has(d)&&!regDays.has(d);
    const dwCls=dw===0?' sun':dw===6?' sat':'';
    const cls=(hasReg?' has':hasSp?' has sp':'')+dwCls+(dk===todayStr?' today-mark':'');
    html+=`<div class="mc-day${cls}">${d}</div>`;
  }
  cal.innerHTML=html;
}

function moveMon(dir){
  curM+=dir;
  if(curM>12){curM=1;curY++;}
  if(curM<1){curM=12;curY--;}
  renderMonth();
}

init();
</script>
</body>
</html>
