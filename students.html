<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>화강암플러스 수강생 관리</title>
<style>
:root {
  --bg:#111114; --surface:#1C1C20; --surface2:#252529;
  --border:#2E2E34; --border2:#3A3A42;
  --text:#E2E0DA; --text2:#8A8880; --text3:#46464E;
  --red:#C0392B; --blue:#4A90D0; --green:#2A9A52;
  --yellow:#C88010; --purple:#7B5EA7;
  --radius:12px; --radius-sm:8px; --sidebar:280px;
  /* alias for compatibility */
  --bg:#111114; --sf:#1C1C20; --sf2:#252529;
  --bd:#2E2E34; --bd2:#3A3A42;
  --tx:#E2E0DA; --tx2:#8A8880; --tx3:#46464E;
  --acc:#4A90D0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}

/* ── 공통 ── */
.tag{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:500;}
.tag-re{background:#2A1515;color:#E06060;}
.tag-dis{background:#152A1E;color:#4AB874;}
.tag-ex{background:#2A1F0A;color:#C88010;}
.tag-bo{background:#0E1E35;color:#4A90D0;}
.tag-fix{background:#1A1530;color:#9B7AE0;}
.tag-pause{background:#1E1A0E;color:#A09060;}
.tag-new{background:#231A06;color:#C8A030;}
.tag-special{background:#1A1530;color:#9B7AE0;}
.remain-badge{display:inline-block;background:#2A1F0A;color:#C88010;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;margin-top:2px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.overlay.on{display:flex;}

/* ════════════════════════
   모바일 레이아웃 (< 900px)
   ════════════════════════ */
#app-mob{display:block;}
#app-pc{display:none;}

#app-mob{background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;min-height:100vh;padding-bottom:80px;}

/* 모바일 헤더 */
#app-mob .sticky-wrap{position:sticky;top:0;z-index:200;}
#app-mob .hdr{background:var(--red);padding:max(14px,env(safe-area-inset-top,14px)) 14px 8px;}
#app-mob .hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
#app-mob .hdr-title{color:#fff;font-size:14px;font-weight:700;}
#app-mob .hdr-sub{color:rgba(255,255,255,.6);font-size:11px;}
#app-mob .unpaid-badge{background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;cursor:pointer;}
#app-mob .summary{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
#app-mob .sum-box{background:rgba(255,255,255,.15);border-radius:7px;padding:5px 8px;}
#app-mob .sum-box.full{background:rgba(255,255,255,.1);}
#app-mob .sum-lbl{color:rgba(255,255,255,.65);font-size:10px;}
#app-mob .sum-val{color:#fff;font-size:13px;font-weight:700;}
#app-mob .tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);overflow-x:auto;}
#app-mob .tabs::-webkit-scrollbar{display:none;}
#app-mob .tab{flex:1;min-width:70px;padding:11px 6px;text-align:center;font-size:13px;font-weight:500;color:var(--tx2);border-bottom:2.5px solid transparent;cursor:pointer;}
#app-mob .tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:700;}
#app-mob .filters{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;}
#app-mob .filters::-webkit-scrollbar{display:none;}
#app-mob .fbtn{padding:5px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);font-size:12px;color:var(--tx2);cursor:pointer;white-space:nowrap;}
#app-mob .fbtn.on{background:var(--text);color:#fff;border-color:var(--tx);}
#app-mob .panel{display:none;padding:0 14px 20px;}
#app-mob .panel.on{display:block;}
#app-mob .sec-hdr{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.07em;padding:14px 0 6px;}
#app-mob .card{background:var(--sf);border-radius:var(--radius);border:1px solid var(--bd);margin-bottom:8px;overflow:hidden;}
#app-mob .card.paid{border-color:#A8DBC0;}
#app-mob .card.unpaid{border-color:#F5C0BB;}
#app-mob .card-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
#app-mob .card-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
#app-mob .card-check.done{background:var(--green);border-color:var(--green);}
#app-mob .card-check.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
#app-mob .card-info{flex:1;min-width:0;}
#app-mob .card-name{font-size:15px;font-weight:600;}
#app-mob .card-cls{font-size:12px;color:var(--tx2);margin-top:1px;}
#app-mob .card-right{text-align:right;flex-shrink:0;}
#app-mob .card-amt{font-size:15px;font-weight:700;color:var(--blue);}
#app-mob .card-amt.zero{color:var(--tx3);}
#app-mob .card-t{font-size:11px;color:var(--tx2);margin-top:1px;}
#app-mob .tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 10px;}
#app-mob .detail{display:none;border-top:1px solid var(--bd);padding:12px 14px;}
#app-mob .detail.on{display:block;}
#app-mob .d-row{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--border);}
#app-mob .d-row:last-of-type{border-bottom:none;}
#app-mob .d-lbl{color:var(--tx2);flex-shrink:0;margin-right:8px;}
#app-mob .d-val{font-weight:500;text-align:right;word-break:break-all;}
#app-mob .d-dates{font-size:11px;color:var(--tx2);line-height:1.7;margin-top:6px;background:var(--bg);padding:8px 10px;border-radius:var(--radius-sm);}
#app-mob .edit-btn{display:inline-flex;align-items:center;gap:4px;margin-top:10px;padding:7px 14px;border:1px solid var(--bd);border-radius:var(--radius-sm);background:var(--bg);font-size:12px;color:var(--tx2);cursor:pointer;}
#app-mob .save-btn{display:inline-flex;align-items:center;gap:4px;margin-top:10px;margin-left:6px;padding:7px 14px;border:none;border-radius:var(--radius-sm);background:var(--blue);font-size:12px;color:#fff;cursor:pointer;}
#app-mob .edit-form{margin-top:10px;display:none;}
#app-mob .edit-form.on{display:block;}
#app-mob .ef-label{font-size:11px;color:var(--tx2);margin-bottom:4px;font-weight:600;}
#app-mob .ef-input{width:100%;border:1px solid var(--bd);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:inherit;margin-bottom:10px;background:var(--bg);}
#app-mob .ef-input:focus{outline:none;border-color:var(--blue);}
textarea#app-mob .ef-input{resize:vertical;min-height:70px;}
#app-mob .search-wrap{padding:8px 14px 2px;position:sticky;top:52px;z-index:198;background:var(--bg);}
#app-mob .search-input{width:100%;padding:9px 14px;border:1px solid var(--bd);border-radius:999px;font-size:14px;font-family:inherit;background:var(--sf);color:var(--tx);outline:none;}
#app-mob .search-input:focus{border-color:var(--blue);}
#app-mob .search-wrap-inner{position:relative;}
#app-mob .search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:18px;cursor:pointer;display:none;}
#app-mob .top-btn{position:fixed;bottom:24px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:299;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;align-items:center;justify-content:center;}
#app-mob .top-btn.show{display:flex;}
/* 모바일 미납 모달 */
#app-mob .overlay{align-items:flex-end;}
#app-mob .modal{background:var(--sf);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:80vh;overflow-y:auto;}
#app-mob .modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
#app-mob .modal-title{font-size:16px;font-weight:700;}
#app-mob .modal-close{font-size:22px;color:var(--tx2);cursor:pointer;padding:0 4px;}
#app-mob .unpaid-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);}
#app-mob .unpaid-item:last-child{border-bottom:none;}
#app-mob .unpaid-name{font-size:14px;font-weight:600;}
#app-mob .unpaid-cls{font-size:12px;color:var(--tx2);}
#app-mob .unpaid-amt{font-size:14px;font-weight:700;color:var(--red);}
#app-mob .unpaid-total{display:flex;justify-content:space-between;padding:12px 0 0;margin-top:4px;}

/* ════════════════════════
   PC 레이아웃 (≥ 900px)
   ════════════════════════ */
#app-pc{font-family:-apple-system,'Segoe UI',sans-serif;height:100vh;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--tx);}
#app-pc .topbar{background:var(--red);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#app-pc .topbar-title{color:#fff;font-size:17px;font-weight:700;}
#app-pc .topbar-right{display:flex;align-items:center;gap:10px;position:relative;}
#app-pc .s-toggle-btn{background:none;border:none;color:rgba(255,255,255,.75);font-size:20px;cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1;}
#app-pc .s-cls-panel{display:flex;align-items:center;gap:0;overflow:hidden;max-width:0;opacity:0;transition:max-width .35s ease,opacity .25s ease;position:absolute;right:28px;top:50%;transform:translateY(-50%);background:var(--red);z-index:1;white-space:nowrap;}
#app-pc .s-cls-panel.open{max-width:500px;opacity:1;}
#app-pc .s-cls-item{display:flex;flex-direction:column;align-items:flex-end;padding:0 10px;border-right:1px solid rgba(255,255,255,.15);flex-shrink:0;}
#app-pc .s-cls-item:last-child{border-right:none;padding-right:0;}
#app-pc .s-cls-name{font-size:10px;color:rgba(255,255,255,.55);margin-bottom:1px;}
#app-pc .s-cls-amt{font-size:12px;font-weight:700;color:#fff;}
#app-pc .s-vdiv{width:1px;height:28px;background:rgba(255,255,255,.2);flex-shrink:0;}
#app-pc .s-main-item{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
#app-pc .s-lbl{font-size:10px;color:rgba(255,255,255,.55);margin-bottom:1px;}
#app-pc .s-val{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;}
#app-pc .s-val.remain{color:#FFB3AE;}
#app-pc .unpaid-btn{background:rgba(0,0,0,.2);color:#fff;border:1px solid rgba(255,255,255,.15);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
#app-pc .main{display:flex;flex:1;overflow:hidden;}
#app-pc .sidebar{width:var(--sidebar);background:var(--sf);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
#app-pc .sidebar-month{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);}
#app-pc .sm-btn{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;color:var(--tx2);border:1px solid var(--bd);background:transparent;cursor:pointer;border-radius:8px;}
#app-pc .sm-btn.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:700;}
#app-pc .sidebar-search{padding:12px 12px 8px;}
#app-pc .search-input{width:100%;padding:7px 12px;border:1px solid var(--bd);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);outline:none;}
#app-pc .search-input:focus{border-color:var(--blue);}
#app-pc .class-filters{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
#app-pc .cf-btn{padding:3px 10px;border-radius:999px;border:1px solid var(--bd);background:transparent;font-size:11px;color:var(--tx2);cursor:pointer;}
#app-pc .cf-btn.on{background:var(--text);color:#fff;border-color:var(--tx);}
#app-pc .student-list{flex:1;overflow-y:auto;padding:4px 8px 12px;}
#app-pc .sec-label{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.07em;padding:10px 6px 4px;text-transform:uppercase;}
#app-pc .s-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:2px;}
#app-pc .s-item:hover{background:var(--bg);}
#app-pc .s-item.active{background:#EBF1F8;}
#app-pc .s-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer;transition:all .15s;}
#app-pc .s-check.done{background:var(--green);border-color:var(--green);}
#app-pc .s-info{flex:1;min-width:0;}
#app-pc .s-name{font-size:13px;font-weight:600;}
#app-pc .s-cls{font-size:11px;color:var(--tx2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#app-pc .s-amt{font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap;flex-shrink:0;}
#app-pc .s-amt.zero{color:var(--tx3);}
#app-pc .content{flex:1;overflow-y:auto;padding:24px;}
#app-pc .no-select{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:15px;}
#app-pc .detail-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px;}
#app-pc .dcard{background:var(--sf);border-radius:var(--radius);border:1px solid var(--bd);padding:20px;margin-bottom:16px;}
#app-pc .dcard-title{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em;}
#app-pc .drow{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bg);}
#app-pc .drow:last-child{border-bottom:none;}
#app-pc .dlbl{font-size:13px;color:var(--tx2);flex-shrink:0;margin-right:12px;}
#app-pc .dval{font-size:13px;font-weight:500;text-align:right;word-break:break-word;}
#app-pc .dval.amount{color:var(--blue);font-size:16px;font-weight:700;}
#app-pc .dval.red{color:var(--red);}
#app-pc .dval.green{color:var(--green);}
#app-pc .paid-toggle{display:flex;align-items:center;gap:8px;margin-top:12px;}
#app-pc .paid-toggle-btn{padding:7px 20px;border-radius:999px;border:none;font-size:13px;font-weight:600;cursor:pointer;}
#app-pc .paid-toggle-btn.unpaid{background:#2A1515;color:var(--red);}
#app-pc .paid-toggle-btn.paid{background:#152A1E;color:var(--green);}
#app-pc .edit-inline{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
#app-pc .ei-row{display:flex;gap:8px;align-items:center;}
#app-pc .ei-label{font-size:12px;color:var(--tx2);width:80px;flex-shrink:0;}
#app-pc .ei-input,#app-pc .ei-textarea{flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);outline:none;}
#app-pc .ei-textarea{resize:vertical;min-height:60px;}
#app-pc .ei-input:focus,#app-pc .ei-textarea:focus{border-color:var(--blue);}
#app-pc .btn-row{display:flex;gap:8px;margin-top:8px;}
#app-pc .btn{padding:7px 16px;border-radius:var(--radius-sm);border:none;font-size:13px;font-weight:600;cursor:pointer;}
#app-pc .btn-blue{background:var(--blue);color:#fff;}
#app-pc .btn-gray{background:var(--border);color:var(--tx);}
#app-pc .msg-panel{background:var(--sf);border-radius:var(--radius);border:1px solid var(--bd);display:flex;flex-direction:column;}
#app-pc .msg-tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 16px;gap:4px;flex-wrap:wrap;}
#app-pc .msg-tab{padding:10px 12px;font-size:12px;font-weight:500;color:var(--tx2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
#app-pc .msg-tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;}
#app-pc .msg-body{flex:1;padding:16px;overflow-y:auto;min-height:300px;}
#app-pc .msg-text{font-size:13px;line-height:1.85;white-space:pre-wrap;color:var(--tx);background:var(--bg);padding:14px;border-radius:var(--radius-sm);}
#app-pc .msg-copy-btn{margin:12px 16px 16px;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;}
#app-pc .msg-empty{color:var(--tx3);font-size:13px;text-align:center;padding:40px 16px;}
/* PC 미납 모달 */
#app-pc .overlay{align-items:center;}
#app-pc .modal{background:var(--sf);border-radius:var(--radius);padding:24px;width:400px;max-height:80vh;overflow-y:auto;}
#app-pc .modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
#app-pc .modal-close{font-size:20px;cursor:pointer;color:var(--tx2);}
#app-pc .unpaid-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);}
#app-pc .unpaid-row:last-child{border-bottom:none;}
#app-pc .unpaid-name{font-size:14px;font-weight:600;}
#app-pc .unpaid-cls{font-size:12px;color:var(--tx2);}
#app-pc .unpaid-amt{font-size:14px;font-weight:700;color:var(--red);}
#app-pc .unpaid-total-row{display:flex;justify-content:space-between;padding:14px 0 0;margin-top:8px;border-top:2px solid var(--border);}
</style>
</head>
<body>

<!-- ── 모바일 앱 ── -->
<div id="app-mob">
<div class="sticky-wrap">
  <div class="hdr" id="mainHdr">
    <div class="hdr-top">
      <div>
        <div class="hdr-title">화강암플러스 수강생 관리</div>
        <div class="hdr-sub" id="hdrSub"></div>
      </div>
      <span id="fb-status" style="font-size:10px;color:rgba(255,255,255,.7);margin-right:8px"></span>
      <div class="unpaid-badge" onclick="openUnpaid()">미납 확인</div>
    </div>
    <div class="summary" id="summaryBox" style="min-height:20px;color:white;font-size:12px">로딩중...</div>
  </div>
  <div class="tabs">
    <div class="tab on" onclick="mobSwitchTab('jul',this)" id="mobTab1">7월</div>
    <div class="tab" onclick="mobSwitchTab('aug',this)" id="mobTab2">8월(예정)</div>
  </div>
</div>
<div class="search-wrap">
  <div class="search-wrap-inner">
    <input class="search-input" id="mobSearchInput" type="text" placeholder="이름 검색..." oninput="mobOnSearch(this.value)">
    <span class="search-clear" id="searchClear" onclick="mobClearSearch()">×</span>
  </div>
</div>
<button class="top-btn" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="panel on" id="panel-jul">
  <div class="filters">
    <button class="fbtn on" onclick="mobFilterCls('jul','all',this)">전체</button>
    <button class="fbtn" onclick="mobFilterCls('jul','입시반',this)">입시반</button>
    <button class="fbtn" onclick="mobFilterCls('jul','예비반',this)">예비반</button>
    <button class="fbtn" onclick="mobFilterCls('jul','중등반',this)">중등반</button>
    <button class="fbtn" onclick="mobFilterCls('jul','취미반',this)">취미반</button>
    <button class="fbtn" onclick="mobFilterCls('jul','미납',this)">미납</button>
  </div>
  <div id="list-jul"></div>
</div>
<div class="panel" id="panel-aug">
  <div class="filters">
    <button class="fbtn on" onclick="mobFilterCls('aug','all',this)">전체</button>
    <button class="fbtn" onclick="mobFilterCls('aug','입시반',this)">입시반</button>
    <button class="fbtn" onclick="mobFilterCls('aug','예비반',this)">예비반</button>
    <button class="fbtn" onclick="mobFilterCls('aug','중등반',this)">중등반</button>
    <button class="fbtn" onclick="mobFilterCls('aug','취미반',this)">취미반</button>
  </div>
  <div id="list-aug"></div>
</div>
<!-- 모바일 미납 모달 -->
<div class="overlay" id="mobUnpaidOverlay" onclick="if(event.target===this)closeMobUnpaid()">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title">미납 현황</div>
      <span class="modal-close" onclick="closeMobUnpaid()">×</span>
    </div>
    <div id="mobUnpaidList"></div>
    <div class="unpaid-total">

<script>
// ══════════════════════════════════
// 공통 데이터 & Firebase
// ══════════════════════════════════
const FB_URL = 'https://hwa1-c1ad9-default-rtdb.firebaseio.com';
const BANK = '부산은행 101-2092-8547-06 (예금주: 화강암플러스미술학원)';
const CONTACT = '학원: 051-553-3698\n원장: 010-7701-6594 (문자 문의 가능)';
const FOOTER = `\n■ 납부 방법\n${BANK}\n카드결제 시 아이편으로 보내주시면 결제 도와드리겠습니다.\n\n■ 문의\n${CONTACT}\n감사합니다.`;

// initData 제거 - Firebase students_list에서 동적 로드
const initData = {}; // 더 이상 사용 안함


// ── 스토리지 ──
function loadDB(){ return {}; } // initData 제거됨 - Firebase에서 동적 로드
function saveDB(d){
  const paidMap = {};
  Object.keys(d).forEach(m=>{ if(d[m]&&Array.isArray(d[m])) d[m].forEach(s=>{ paidMap[s.id]=s.paid; }); });
  fetch(`${FB_URL}/paid.json`,{method:'PUT',body:JSON.stringify(paidMap),headers:{'Content-Type':'application/json'}}).catch(()=>{});
}
function saveEdits(){
  // 편집된 학생 데이터(수강료, 메모, 수업일자 등) Firebase에 저장
  const edits={};
  ['jul','aug'].forEach(m=>{ if(db[m]) db[m].forEach(s=>{
    // 자동계산 학생: memo/absence만 저장
    // 고정/취미/할인: amount도 저장
    const RATE_MAP_FIX=['박선영','박하영','박민지'];
    const isFixed=RATE_MAP_FIX.includes(s.name)||s.cls==='취미반'||s.tags?.some?.(t=>t.startsWith('pause:'));
    const changed={};
    if(isFixed){
      if(s.amount!==0)changed.amount=s.amount;
      if(s.totalT)changed.totalT=s.totalT;
      if(s.days)changed.days=s.days;
    }
    if(s.memo)changed.memo=s.memo;
    if(s.absence)changed.absence=s.absence;
    if(s.remain!=null)changed.remain=s.remain;
    if(Object.keys(changed).length>0)edits[s.id]=changed;
  });});
  console.log('saveEdits 저장:', JSON.stringify(edits));
  fetch(`${FB_URL}/student_edits.json`,{method:'PUT',body:JSON.stringify(edits),headers:{'Content-Type':'application/json'}})
    .then(r=>console.log('saveEdits 완료:', r.status))
    .catch(e=>console.error('saveEdits 실패:', e));
}
async function loadEdits(){
  try{
    const r=await fetch(`${FB_URL}/student_edits.json?_=${Date.now()}`);
    if(!r.ok)return;
    const edits=await r.json();
    if(!edits||typeof edits!=='object')return;
    ['jul','aug'].forEach(m=>{ if(db[m]) db[m].forEach(s=>{
      const e=edits[s.id];
      if(!e)return;
      if(e.amount!==undefined)s.amount=e.amount;
      if(e.totalT!==undefined)s.totalT=e.totalT;
      if(e.days!==undefined)s.days=e.days;
      if(e.schedule!==undefined)s.schedule=e.schedule;
      if(e.memo!==undefined)s.memo=e.memo;
      if(e.absence!==undefined)s.absence=e.absence;
      if(e.remain!==undefined)s.remain=e.remain;
    });});
  }catch(e){console.log('edits 로드 실패');}
}
async function syncFromFirebase(){
  const statusEl=document.getElementById('fb-status');
  try{
    const [r,br,sr]=await Promise.all([
      fetch(`${FB_URL}/paid.json?_=${Date.now()}`),
      fetch(`${FB_URL}/schedule_backup.json?_=${Date.now()}`),
      fetch(`${FB_URL}/students_list.json?_=${Date.now()}`)
    ]);
    if(!r.ok){if(statusEl)statusEl.textContent='Firebase 오류: '+r.status;return;}

    // paid 적용
    const paidMap=await r.json();
    const _paidMap=(paidMap&&typeof paidMap==='object')?paidMap:{};
    Object.keys(db).forEach(m=>{if(db[m]&&Array.isArray(db[m]))db[m].forEach(s=>{if(_paidMap[s.id]!==undefined)s.paid=_paidMap[s.id];});});

    // students_list 동기화
    if(sr&&sr.ok){
      try{
        const stuList=await sr.json();
        window._stuList=stuList;
        if(stuList&&typeof stuList==='object'){
          const fbNamesByCls={};
          Object.entries(stuList).forEach(([cls,stus])=>{
            if(!Array.isArray(stus))return;
            fbNamesByCls[cls]=stus.filter(s=>s.name).map(s=>s.name);
          });
          const allFbNames=new Set(Object.values(fbNamesByCls).flat());
          Object.keys(db).forEach(mon=>{
            if(!db[mon]||!Array.isArray(db[mon]))return;
            // 제거된 학생 삭제
            db[mon]=db[mon].filter(s=>allFbNames.has(s.name));
            // 신규 학생 추가
            Object.entries(stuList).forEach(([cls,stus])=>{
              if(!Array.isArray(stus))return;
              stus.forEach(stu=>{
                if(!stu.name)return;
                const id=mon+'_'+stu.name;
                if(db[mon].find(s=>s.id===id))return;
                db[mon].push({id,name:stu.name,cls,tags:[],schedule:(stu.days||[]).join(','),days:'',absence:0,totalT:0,amount:0,fixed:false,paid:_paidMap[id]||false,memo:'',remain:null});
              });
            });
          });
        }
      }catch(e){console.log('students_list 로드 실패',e);}
    }

    // student_edits 로드
    let _edits={};
    try{
      const er=await fetch(`${FB_URL}/student_edits.json?_=${Date.now()}`);
      if(er.ok){const ed=await er.json();if(ed&&typeof ed==='object')_edits=ed;}
    }catch(e){}

    // schedule_backup 기반 수강료 계산
    if(br.ok){
      const backup=await br.json();
      if(backup&&typeof backup==='object'){
        const MON_MAP={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
        Object.keys(db).forEach(mon=>{
          const mNum=MON_MAP[mon];if(!mNum)return;
          if(!db[mon]||!Array.isArray(db[mon]))return;
          db[mon].forEach(s=>{
            // edits에 amount 있으면 자동계산 건너뜀
            const _e=_edits[s.id];
            if(_e&&(_e.amount!==undefined||_e.totalT!==undefined))return;
            // 잔여타임 학생 건너뜀
            if(s.tags?.some?.(t=>t.startsWith('pause:')))return;

            const key=`${s.cls}_${s.name}_${mNum}`;
            const sdata=backup[key];
            if(!sdata)return;
            const regT=(sdata.lessons||[]).length;
            const spT=(sdata.special||[]).length;
            const absT=sdata.abs||s.absence||0;

            if(s.cls==='취미반'){
              // 취미반: 실타임 기반 주당 횟수 판단 (데이터 없으면 건너뜀)
              if(regT===0&&spT===0){return;} // 시간표 체크 없으면 0원 유지
              const weeklyCount=regT>0?Math.round(regT/5):1;
              const isW2=weeklyCount>=2;
              const wRate=isW2?50000:25000;
              const baseAmt=isW2?200000:100000;
              if(absT===0&&spT===0){
                s.amount=baseAmt;s.days='주'+(isW2?2:1)+'회';
              }else{
                const netT=Math.max(0,regT-absT);
                s.amount=netT*wRate+spT*wRate;
                s.days=absT>0?`실수업 ${regT}T - 결석 ${absT}회 = ${netT}T`:`${regT}T`;
              }
              s.totalT=Math.max(0,regT-absT)+spT;
            }else{
              // 일반: (정규+특강-결석) × 단가
              const rate=s.cls==='예비반'?30000:31250;
              const netT=Math.max(0,regT+spT-absT);
              s.amount=netT*rate;
              s.totalT=netT;
              if(spT>0)s.days=`정규 ${regT}T / 특강 ${spT}T${absT>0?' / 전월결석 -'+absT+'T':''} = 총 ${s.totalT}T`;
              else s.days=`${regT}T${absT>0?' (전월결석 -'+absT+'T)':''}`;
            }
            s.absence=absT;
          });
        });
      }
    }

    // student_edits 적용
    Object.keys(db).forEach(m=>{
      if(db[m]&&Array.isArray(db[m]))db[m].forEach(s=>{
        const e=_edits[s.id];if(!e)return;
        if(e.amount!==undefined)s.amount=e.amount;
        if(e.totalT!==undefined)s.totalT=e.totalT;
        if(e.days!==undefined)s.days=e.days;
        if(e.schedule!==undefined)s.schedule=e.schedule;
        if(e.memo!==undefined)s.memo=e.memo;
        if(e.absence!==undefined)s.absence=e.absence;
        if(e.remain!==undefined)s.remain=e.remain;
      });
    });

    if(isPC()){pcRenderFilters();pcRenderSidebar();pcRenderSummary();}
    else{Object.keys(db).forEach(m=>{if(db[m]&&Array.isArray(db[m])){mobRender(m);mobRenderSummary(m);}});}
    if(statusEl)statusEl.textContent='';
  }catch(e){if(statusEl)statusEl.textContent='연결 실패';console.error(e);}
}
function getCurMonLabel(){
  return ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][new Date().getMonth()];
}
function getNxtMonLabel(){
  return ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][(new Date().getMonth()+1)%12];
}
function remapDB(db){
  const cur=getCurMonLabel(), nxt=getNxtMonLabel();
  const remapped={};
  // jul/aug 키가 있으면 현재달/다음달로 리매핑
  if(db['jul']) remapped[cur]=db['jul'];
  if(db['aug']) remapped[nxt]=db['aug'];
  // 나머지 키는 그대로
  Object.keys(db).forEach(k=>{ if(k!=='jul'&&k!=='aug') remapped[k]=db[k]; });
  // 현재달/다음달 없으면 빈 배열 생성
  if(!remapped[cur]) remapped[cur]=[];
  if(!remapped[nxt]) remapped[nxt]=[];
  return remapped;
}
function getDB(){
  const saved=loadDB();
  // saved 데이터 기본값 보정
  Object.keys(saved).forEach(m=>{
    if(saved[m]&&Array.isArray(saved[m])){
      saved[m].forEach(s=>{ if(!s.tags)s.tags=[]; if(s.remain===undefined)s.remain=null; });
    }
  });
  return remapDB(saved);
}
let db = getDB();
const fmt = n => n===0?'0원':n.toLocaleString('ko-KR')+'원';
function tagHtml(t){
  const [k,...rest]=t.split(':'); const label=rest.join(':');
  const cls=k==='fix'?'tag-fix':k==='pause'?'tag-pause':k==='re'?'tag-re':k==='dis'?'tag-dis':k==='bo'?'tag-bo':k==='new'?'tag-new':k==='special'?'tag-special':'tag-fix';
  return `<span class="tag ${cls}">${label}</span>`;
}

function renderAll(){
  if(isPC()){ pcRenderFilters(); pcRenderSidebar(); pcRenderSummary(); }
  else { mobRender(mobGetActiveMonth()); mobRenderSummary(mobGetActiveMonth()); }
}

// ══════════════════════════════════
// 반응형 분기
// ══════════════════════════════════
const isPC = () => window.innerWidth >= 900;

function updateMonthLabels(){
  const now=new Date();
  const cm=now.getMonth()+1, nm=cm===12?1:cm+1;
  const cur=getCurMonLabel(), nxt=getNxtMonLabel();
  const t1=document.getElementById('mobTab1');
  const t2=document.getElementById('mobTab2');
  const b1=document.getElementById('pcBtn1');
  const b2=document.getElementById('pcBtn2');
  if(t1){t1.textContent=cm+'월';t1.onclick=()=>mobSwitchTab(cur,t1);}
  if(t2){t2.textContent=nm+'월(예정)';t2.onclick=()=>mobSwitchTab(nxt,t2);}
  if(b1){b1.textContent=cm+'월';b1.onclick=()=>pcSwitchMonth(cur,b1);}
  if(b2){b2.textContent=nm+'월(예정)';b2.onclick=()=>pcSwitchMonth(nxt,b2);}
  window._curMonLabel=cur; window._nxtMonLabel=nxt;
  // 현재달이 aug가 아니면 panel 상태도 교정
  if(cur!=='jul'){
    document.getElementById('panel-jul')?.classList.remove('on');
    document.getElementById('panel-aug')?.classList.add('on');
    document.getElementById('mobTab1')?.classList.remove('on');
    document.getElementById('mobTab2')?.classList.add('on');
  }
}
function init(){
  updateMonthLabels();
  if(isPC()){
    document.body.className='pc';
    document.getElementById('app-mob').style.display='none';
    document.getElementById('app-pc').style.display='flex';
    pcRenderFilters();
    // 로딩 표시
    document.getElementById('studentList').innerHTML='<div style="padding:20px;color:var(--tx3);text-align:center;font-size:13px">불러오는 중...</div>';
  } else {
    document.body.className='mob';
    document.getElementById('app-pc').style.display='none';
    document.getElementById('app-mob').style.display='block';
    document.getElementById('list-jul').innerHTML='<div style="padding:20px;color:#999;text-align:center;font-size:13px">불러오는 중...</div>';
    window.addEventListener('scroll',()=>{
      const btn=document.getElementById('topBtn');
      if(btn) btn.classList.toggle('show', window.scrollY>200);
    });
  }
  // Firebase 먼저 불러온 후 렌더 (syncFromFirebase 안에서 renderAll 호출)
  // 헤더 날짜 동적 설정
  const now=new Date();const sub=document.getElementById('hdrSub');if(sub)sub.textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월`;
  syncFromFirebase().then(()=>{
    setInterval(syncFromFirebase, 30000);
  }).catch(()=>setInterval(syncFromFirebase, 30000));

// ══════════════════════════════════
// 모바일 로직
// ══════════════════════════════════
let mobFilter = {}; // 동적으로 현재달/다음달 키 사용
function getMobFilter(mon){ return mobFilter[mon]||'all'; }
let mobSearchQ = '';

function mobGetActiveMonth(){
  const isAugOn=document.getElementById('panel-aug')?.classList.contains('on');
  return isAugOn?(window._nxtMonLabel||getNxtMonLabel()):(window._curMonLabel||getCurMonLabel());
}
function mobOnSearch(v){ mobSearchQ=v.trim().toLowerCase(); document.getElementById('searchClear').style.display=v?'block':'none'; mobRender(mobGetActiveMonth()); }
function mobClearSearch(){ document.getElementById('mobSearchInput').value=''; document.getElementById('searchClear').style.display='none'; mobSearchQ=''; mobRender(mobGetActiveMonth()); }
function mobSwitchTab(month,el){
  document.querySelectorAll('#app-mob .tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('#app-mob .panel').forEach(p=>p.classList.remove('on'));
  el.classList.add('on'); document.getElementById('panel-'+month).classList.add('on');
  mobRenderSummary(month);
  const now2=new Date();const cm2=now2.getMonth()+1,cy2=now2.getFullYear();const nm2=cm2===12?1:cm2+1,ny2=cm2===12?cy2+1:cy2;
  const _cur=window._curMonLabel||getCurMonLabel();
  document.getElementById('hdrSub').textContent=month===_cur?(cy2+'년 '+cm2+'월'):(ny2+'년 '+nm2+'월 (예정)');
}
function mobFilterCls(month,cls,btn){
  mobFilter[month]=cls;
  document.querySelectorAll('#panel-'+month+' .fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); mobRender(month);
}
function mobRender(month){
  const filter=getMobFilter(month);
  const list=document.getElementById('list-'+month); if(!list) return;
  list.innerHTML='';
  const items=db[month].filter(s=>{
    if(s.amount===0&&s.remain==null&&!s.fixed) return false;
    if(mobSearchQ&&!s.name.toLowerCase().includes(mobSearchQ)) return false;
    if(filter==='all') return true;
    if(filter==='미납'){ return !s.paid&&s.amount>0; }
    return s.cls===filter;
  });
  const groups={}; items.forEach(s=>{ if(!groups[s.cls])groups[s.cls]=[]; groups[s.cls].push(s); });
  ['입시반','예비반','중등반','취미반'].forEach(cls=>{
    if(!groups[cls]) return;
    const hdr=document.createElement('div'); hdr.className='sec-hdr'; hdr.textContent=cls; list.appendChild(hdr);
    groups[cls].forEach(s=>{ const card=mobMakeCard(s,month); if(card)list.appendChild(card); });
  });
}
function mobMakeCard(s,month){
  if(s.amount===0&&s.remain==null&&!s.fixed) return null;
  const div=document.createElement('div');
  div.className='card'+(s.paid?' paid':(s.amount>0?' unpaid':''));
  const amtD=s.remain!=null?`잔여 ${s.remain}T`:(s.amount===0?'수강없음':fmt(s.amount));
  const tD=s.remain!=null?'수강 없음':(s.totalT>0?`총 ${s.totalT}T`:(s.fixed?'고정요금':''));
  const tagsStr=(s.tags||[]).map(t=>tagHtml(t)).join('');
  const remainB=s.remain!=null?`<div class="remain-badge">잔여 ${s.remain}T</div>`:'';
  div.innerHTML=`
    <div class="card-top" onclick="mobToggleDetail('${s.id}')">
      <div class="card-check ${s.paid?'done':''}" onclick="mobTogglePaid(event,'${s.id}','${month}')"></div>
      <div class="card-info"><div class="card-name">${s.name}</div><div class="card-cls">${s.schedule.split('\n')[0]}</div>${remainB}</div>
      <div class="card-right"><div class="card-amt ${s.amount===0&&s.remain===null?'zero':''}">${amtD}</div><div class="card-t">${tD}</div></div>
    </div>
    ${tagsStr?`<div class="tags">${tagsStr}</div>`:''}
    <div class="detail" id="detail-${s.id}">
      <div class="d-row"><span class="d-lbl">수업 요일</span><span class="d-val">${s.schedule.replace(/\n/g,'<br>')}</span></div>
      ${s.days?`<div class="d-row"><span class="d-lbl">수업 일자/시수</span><span class="d-val">${s.days.replace(/\n/g,'<br>')}</span></div>`:''}
      ${s.absence>0?`<div class="d-row"><span class="d-lbl">결석 차감</span><span class="d-val" style="color:var(--red)">-${s.absence}T</span></div>`:''}
      <div class="d-row"><span class="d-lbl">수강료</span><span class="d-val" style="color:var(--blue);font-weight:700">${s.remain!==null?'해당없음 (잔여'+s.remain+'T)':fmt(s.amount)}</span></div>
      <div class="d-row"><span class="d-lbl">결제여부</span><span class="d-val" style="color:${s.paid?'var(--green)':'var(--red)'}">${s.paid?'결제완료':'미납'}</span></div>
      ${s.memo?`<div class="d-dates">${s.memo}</div>`:''}
      <button class="edit-btn" onclick="mobOpenEdit('${s.id}','${month}')">편집</button>
      <div class="edit-form" id="edit-${s.id}">
        <div class="ef-label">수업 요일/일정</div><textarea class="ef-input" id="ef-schedule-${s.id}">${s.schedule}</textarea>
        <div class="ef-label">수업 일자/시수</div><textarea class="ef-input" id="ef-days-${s.id}">${s.days}</textarea>
        <div class="ef-label">결석 차감(T)</div><input class="ef-input" type="number" id="ef-abs-${s.id}" value="${s.absence}">
        <div class="ef-label">총 시수(T)</div><input class="ef-input" type="number" id="ef-total-${s.id}" value="${s.totalT}">
        <div class="ef-label">수강료(원)</div><input class="ef-input" type="number" id="ef-amt-${s.id}" value="${s.amount}">
        ${s.remain!==null?`<div class="ef-label">잔여 타임(T)</div><input class="ef-input" type="number" id="ef-remain-${s.id}" value="${s.remain}">`:''}
        <div class="ef-label">메모</div><textarea class="ef-input" id="ef-memo-${s.id}">${s.memo}</textarea>
        <button class="save-btn" onclick="mobSaveEdit('${s.id}','${month}')">저장</button>
        <button class="edit-btn" style="margin-left:0;margin-top:0" onclick="mobCancelEdit('${s.id}')">취소</button>
      </div>
    </div>`;
  return div;
}
function mobToggleDetail(id){ document.getElementById('detail-'+id)?.classList.toggle('on'); }
function mobTogglePaid(e,id,month){ e.stopPropagation(); const s=db[month].find(x=>x.id===id); if(s){s.paid=!s.paid; saveDB(db); mobRender(month); mobRenderSummary(month);} }
function mobOpenEdit(id,month){ document.getElementById('edit-'+id)?.classList.add('on'); document.getElementById('detail-'+id)?.classList.add('on'); }
function mobCancelEdit(id){ document.getElementById('edit-'+id)?.classList.remove('on'); }
function mobSaveEdit(id,month){
  const s=db[month].find(x=>x.id===id); if(!s) return;
  s.schedule=document.getElementById('ef-schedule-'+id).value;
  s.days=document.getElementById('ef-days-'+id).value;
  s.absence=parseInt(document.getElementById('ef-abs-'+id).value)||0;
  s.totalT=parseInt(document.getElementById('ef-total-'+id).value)||0;
  s.amount=parseInt(document.getElementById('ef-amt-'+id).value)||0;
  s.memo=document.getElementById('ef-memo-'+id).value;
  const rem=document.getElementById('ef-remain-'+id); if(rem){ const rv=parseInt(rem.value); s.remain=(isNaN(rv)||rv<0)?null:rv; } else s.remain=null;
  saveDB(db); saveEdits(); mobRender(month); mobRenderSummary(month);
  setTimeout(()=>document.getElementById('detail-'+id)?.classList.add('on'),50);
}
function mobRenderSummary(month){
  const items=(db[month]||[]).filter(s=>s.amount>0||s.remain!=null); if(!items.length) return;
  const total=items.reduce((a,s)=>a+(s.amount||0),0);
  const paid=(db[month]||[]).filter(s=>s.paid).reduce((a,s)=>a+(s.amount||0),0);
  const clsList=['입시반','예비반','중등반','취미반'];
  const clsSums={}; clsList.forEach(c=>clsSums[c]=0); items.forEach(s=>{ if(clsSums[s.cls]!==undefined) clsSums[s.cls]+=s.amount; });
  const box=document.getElementById('summaryBox'); if(!box) return;
  box.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px">
    <div class="sum-box"><div class="sum-lbl">총 수강료</div><div class="sum-val">${fmt(total)}</div></div>
    <div class="sum-box"><div class="sum-lbl">결제 완료</div><div class="sum-val">${fmt(paid)}</div></div>
    <div class="sum-box"><div class="sum-lbl">잔여</div><div class="sum-val" style="color:${(total-paid)>0?'#ffcc88':'#26de81'}">${fmt(total-paid)}</div></div>
  </div>
  <div class="sum-box full"><div style="display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none">
    ${clsList.map(c=>`<span style="white-space:nowrap;font-size:11px;color:#fff"><span style="opacity:.7">${c}</span> <b>${fmt(clsSums[c])}</b></span>`).join('<span style="color:rgba(255,255,255,.3)">·</span>')}
  </div></div>`;
}
function openUnpaid(){
  const isMobile=!isPC();
  const ul=document.getElementById(isMobile?'mobUnpaidList':'pcUnpaidList'); ul.innerHTML=''; let total=0;
  ['jul','aug'].forEach(month=>{
    const today=new Date(),cut=month==='jul'?new Date(2026,6,10):new Date(2026,7,10); if(today<cut)return;
    db[month].filter(s=>!s.paid&&s.amount>0).forEach(s=>{
      total+=s.amount;
      const label=month==='jul'?'7월':'8월';
      if(isMobile) ul.innerHTML+=`<div class="unpaid-item"><div><div class="unpaid-name">${s.name} <span style="font-size:11px;color:var(--tx3)">${label}</span></div><div class="unpaid-cls">${s.cls}</div></div><div class="unpaid-amt">${fmt(s.amount)}</div></div>`;
      else ul.innerHTML+=`<div class="unpaid-row"><div><div class="unpaid-name">${s.name} <span style="font-size:11px;color:var(--tx3)">${label}</span></div><div class="unpaid-cls">${s.cls}</div></div><div class="unpaid-amt">${fmt(s.amount)}</div></div>`;
    });
  });
  if(!ul.innerHTML) ul.innerHTML='<div style="text-align:center;padding:20px;color:var(--tx3)">미납 없음</div>';
  document.getElementById(isMobile?'mobUnpaidTotal':'pcUnpaidTotal').textContent=fmt(total);
  document.getElementById(isMobile?'mobUnpaidOverlay':'pcUnpaidOverlay').classList.add('on');
}
function closeMobUnpaid(){ document.getElementById('mobUnpaidOverlay').classList.remove('on'); }
function closePcUnpaid(){ document.getElementById('pcUnpaidOverlay').classList.remove('on'); }

// ══════════════════════════════════
// PC 로직
// ══════════════════════════════════
let pcMonth=getCurMonLabel(), pcFilter='all', pcStudent=null, pcMsgTab=0, pcSearchQ='', pcEditing=false;

function pcSwitchMonth(m,el){
  pcMonth=m; pcStudent=null;
  document.querySelectorAll('#app-pc .sm-btn').forEach(t=>t.classList.remove('on')); el.classList.add('on');
  pcRenderFilters(); pcRenderSidebar(); pcRenderSummary();
  document.getElementById('mainContent').innerHTML='<div class="no-select">← 학생을 선택하세요</div>';
}
function pcOnSearch(v){ pcSearchQ=v.trim(); pcRenderSidebar(); }
function pcRenderFilters(){
  const fc=document.getElementById('classFilters'); if(!fc) return; fc.innerHTML='';
  ['all','입시반','예비반','중등반','취미반','미납'].forEach(f=>{
    const b=document.createElement('button'); b.className='cf-btn'+(pcFilter===f?' on':'');
    b.textContent=f==='all'?'전체':f;
    b.onclick=()=>{ pcFilter=f; pcRenderFilters(); pcRenderSidebar(); }; fc.appendChild(b);
  });
}
function pcRenderSidebar(){
  const list=document.getElementById('studentList'); if(!list) return; list.innerHTML='';
  const items=db[pcMonth].filter(s=>{
    if(s.amount===0&&s.remain==null&&!s.fixed) return false;
    if(pcSearchQ&&!s.name.includes(pcSearchQ)) return false;
    if(pcFilter==='all') return true;
    if(pcFilter==='미납'){ return !s.paid&&s.amount>0; }
    return s.cls===pcFilter;
  });
  const groups={}; ['입시반','예비반','중등반','취미반'].forEach(c=>groups[c]=[]);
  items.forEach(s=>{ if(groups[s.cls]) groups[s.cls].push(s); });
  ['입시반','예비반','중등반','취미반'].forEach(cls=>{
    if(!groups[cls].length) return;
    const lbl=document.createElement('div'); lbl.className='sec-label'; lbl.textContent=cls; list.appendChild(lbl);
    groups[cls].forEach(s=>{
      const div=document.createElement('div'); div.className='s-item'+(pcStudent?.id===s.id?' active':'');
      const amtTxt=s.remain!=null?`잔여 ${s.remain}T`:(s.amount===0?'-':fmt(s.amount));
      div.innerHTML=`<div class="s-check ${s.paid?'done':''}" onclick="pcTogglePaid(event,'${s.id}')">${s.paid?'✓':''}</div>
        <div class="s-info" onclick="pcSelectStudent('${s.id}')"><div class="s-name">${s.name}</div><div class="s-cls">${s.schedule.split('\n')[0]}</div></div>
        <div class="s-amt ${s.amount===0&&s.remain===null?'zero':''}" onclick="pcSelectStudent('${s.id}')">${amtTxt}</div>`;
      list.appendChild(div);
    });
  });
}
function pcRenderSummary(){
  const items=db[pcMonth]||[]; if(!items.length) return;
  const total=items.reduce((a,s)=>a+(s.amount||0),0);
  const paid=items.filter(s=>s.paid).reduce((a,s)=>a+(s.amount||0),0);
  const clsList=['입시반','예비반','중등반','취미반'];
  const clsTotal={}; clsList.forEach(c=>clsTotal[c]=0); items.forEach(s=>{ if(clsTotal[s.cls]!==undefined) clsTotal[s.cls]+=(s.amount||0); });
  const row=document.getElementById('summaryRow1'); if(!row) return;
  row.innerHTML=`<div style="position:relative;display:flex;align-items:center;">
    <button class="s-toggle-btn" id="clsToggleBtn" onclick="pcToggleCls()">›</button>
    <div class="s-cls-panel" id="clsPanel">${clsList.map(c=>`<div class="s-cls-item"><span class="s-cls-name">${c}</span><span class="s-cls-amt">${fmt(clsTotal[c])}</span></div>`).join('')}</div>
  </div>
  <div class="s-vdiv"></div>
  <div class="s-main-item"><span class="s-lbl">총 수강료</span><span class="s-val">${fmt(total)}</span></div>
  <div class="s-vdiv"></div>
  <div class="s-main-item"><span class="s-lbl">결제 완료</span><span class="s-val">${fmt(paid)}</span></div>
  <div class="s-vdiv"></div>
  <div class="s-main-item"><span class="s-lbl">잔여</span><span class="s-val remain">${fmt(total-paid)}</span></div>`;
}
function pcToggleCls(){ const p=document.getElementById('clsPanel'),b=document.getElementById('clsToggleBtn'); if(!p)return; p.classList.toggle('open'); b.textContent=p.classList.contains('open')?'‹':'›'; }
function pcSelectStudent(id){ const s=db[pcMonth].find(x=>x.id===id); if(!s)return; pcStudent=s; pcMsgTab=0; pcEditing=false; pcRenderSidebar(); pcRenderDetail(); }
function pcTogglePaid(e,id){ e.stopPropagation(); Object.keys(db).forEach(m=>{ const s=db[m]?.find(x=>x.id===id); if(s)s.paid=!s.paid; }); saveDB(db); pcRenderSidebar(); pcRenderSummary(); if(pcStudent?.id===id){pcStudent=db[pcMonth]?.find(x=>x.id===id);pcRenderDetail();} }

// ── 문자 생성 ──
function msgFeeNormal(s,month){
  const mon=month==='jul'?'7월':'8월';
  if(s.remain!=null) return `[수강 현황 안내 - ${s.name} 학생 (${s.cls})]\n안녕하세요. 화강암플러스미술학원입니다.\n\n■ 잔여 타임\n${s.remain}T 남음\n\n■ 문의\n${CONTACT}\n감사합니다.`;
  let body=`■ 수업 일정\n${s.schedule}`;
  if(s.days) body+=`\n\n■ 수업 일자 / 시수\n${s.days}`;
  if(s.absence>0) body+=`\n\n■ 전월 결석 차감\n-${s.absence}T (-${(s.absence*31250).toLocaleString()}원)`;
  body+=`\n\n■ ${mon} 수강료\n${s.amount.toLocaleString()}원`;
  if(s.memo) body+=`\n\n■ 참고\n${s.memo}`;
  return `[${mon} 수강료 안내 - ${s.name} 학생 (${s.cls})]\n안녕하세요. 화강암플러스미술학원입니다.\n${s.name} 학생의 ${mon} 수강료를 안내드립니다.\n\n${body}${FOOTER}`;
}
function getMessages(s,month){
  const msgs=[{label:`${month==='jul'?'7':'8'}월 수강료`,text:msgFeeNormal(s,month)}];
  return msgs;
}

function pcRenderDetail(){
  const c=document.getElementById('mainContent'); if(!c) return;
  if(!pcStudent){c.innerHTML='<div class="no-select">← 학생을 선택하세요</div>';return;}
  const s=pcStudent, msgs=getMessages(s,pcMonth);
  c.innerHTML=`<div class="detail-wrap">
    <div class="detail-left">
      <div class="dcard">
        <div class="dcard-title">${s.name} · ${s.cls}</div>
        <div style="margin-bottom:10px">${(s.tags||[]).map(tagHtml).join('')}</div>
        <div class="drow"><span class="dlbl">수업 요일</span><span class="dval">${s.schedule.replace(/\n/g,'<br>')}</span></div>
        ${s.days?`<div class="drow"><span class="dlbl">수업일자/시수</span><span class="dval">${s.days.replace(/\n/g,'<br>')}</span></div>`:''}
        ${s.absence>0?`<div class="drow"><span class="dlbl">결석 차감</span><span class="dval red">-${s.absence}T</span></div>`:''}
        ${s.totalT>0?`<div class="drow"><span class="dlbl">총 시수</span><span class="dval">${s.totalT}T</span></div>`:''}
        <div class="drow"><span class="dlbl">수강료</span><span class="dval amount">${s.remain!==null?'해당없음':fmt(s.amount)}</span></div>
        ${s.remain!==null?`<div class="drow"><span class="dlbl">잔여 타임</span><span class="dval"><span class="remain-badge">${s.remain}T</span></span></div>`:''}
        <div class="drow"><span class="dlbl">결제 여부</span><span class="dval ${s.paid?'green':'red'}">${s.paid?'결제완료':'미납'}</span></div>
        ${s.memo?`<div class="drow"><span class="dlbl">메모</span><span class="dval">${s.memo}</span></div>`:''}
        ${s.schoolInfo&&s.schoolInfo.exam?`<div class="drow"><span class="dlbl">기말고사</span><span class="dval">${s.schoolInfo.exam}</span></div>`:''}
        ${s.schoolInfo&&s.schoolInfo.vacStart?`<div class="drow"><span class="dlbl">방학일정</span><span class="dval">${s.schoolInfo.vacStart} ~ ${s.schoolInfo.vacEnd}<br>개학: ${s.schoolInfo.openDay}</span></div>`:''}
        <div class="paid-toggle">
          <button class="paid-toggle-btn ${s.paid?'paid':'unpaid'}" onclick="pcTogglePaid(event,'${s.id}')">${s.paid?'✓ 결제완료 (클릭시 취소)':'✗ 미납 (클릭시 완료처리)'}</button>
          <button class="btn btn-gray" onclick="pcToggleEdit()">편집</button>
        </div>
        <div id="editForm" style="display:none">
          <div class="edit-inline">
            <div class="ei-row"><span class="ei-label">수업 요일</span><textarea class="ei-textarea" id="ef-schedule">${s.schedule}</textarea></div>
            <div class="ei-row"><span class="ei-label">수업일자/시수</span><textarea class="ei-textarea" id="ef-days">${s.days||''}</textarea></div>
            <div class="ei-row"><span class="ei-label">결석(T)</span><input class="ei-input" type="number" id="ef-abs" value="${s.absence}"></div>
            <div class="ei-row"><span class="ei-label">총 시수(T)</span><input class="ei-input" type="number" id="ef-total" value="${s.totalT}"></div>
            <div class="ei-row"><span class="ei-label">수강료(원)</span><input class="ei-input" type="number" id="ef-amt" value="${s.amount}"></div>
            ${s.remain!==null?`<div class="ei-row"><span class="ei-label">잔여 타임</span><input class="ei-input" type="number" id="ef-remain" value="${s.remain}"></div>`:''}
            <div class="ei-row"><span class="ei-label">메모</span><textarea class="ei-textarea" id="ef-memo">${s.memo||''}</textarea></div>
            <div class="btn-row"><button class="btn btn-blue" onclick="pcSaveEdit()">저장</button><button class="btn btn-gray" onclick="pcToggleEdit()">취소</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="detail-right">
      <div class="msg-panel">
        <div class="msg-tabs" id="msgTabs"></div>
        <div class="msg-body" id="msgBody"></div>
        <button class="msg-copy-btn" onclick="pcCopyMsg()">문자 복사</button>
      </div>
    </div>
  </div>`;
  const tabsEl=document.getElementById('msgTabs'),bodyEl=document.getElementById('msgBody');
  msgs.forEach((m,i)=>{
    const t=document.createElement('div'); t.className='msg-tab'+(i===pcMsgTab?' on':''); t.textContent=m.label;
    t.onclick=()=>{ pcMsgTab=i; document.querySelectorAll('.msg-tab').forEach((x,j)=>x.classList.toggle('on',j===i)); bodyEl.innerHTML=`<div class="msg-text">${msgs[i].text.replace(/\n/g,'<br>')}</div>`; };
    tabsEl.appendChild(t);
  });
  if(msgs.length>0) bodyEl.innerHTML=`<div class="msg-text">${msgs[pcMsgTab].text.replace(/\n/g,'<br>')}</div>`;
}
function pcToggleEdit(){ pcEditing=!pcEditing; document.getElementById('editForm').style.display=pcEditing?'block':'none'; }
function pcSaveEdit(){
  const s=db[pcMonth].find(x=>x.id===pcStudent.id); if(!s) return;
  s.schedule=document.getElementById('ef-schedule').value;
  s.days=document.getElementById('ef-days').value;
  s.absence=parseInt(document.getElementById('ef-abs').value)||0;
  s.totalT=parseInt(document.getElementById('ef-total').value)||0;
  s.amount=parseInt(document.getElementById('ef-amt').value)||0;
  s.memo=document.getElementById('ef-memo').value;
  const rem=document.getElementById('ef-remain'); if(rem){ const rv=parseInt(rem.value); s.remain=(isNaN(rv)||rv<0)?null:rv; } else s.remain=null;
  saveDB(db); saveEdits(); pcStudent=s; pcEditing=false; pcRenderSidebar(); pcRenderSummary(); pcRenderDetail();
}
function pcCopyMsg(){
  const msgs=getMessages(pcStudent,pcMonth); if(!msgs[pcMsgTab]) return;
  navigator.clipboard.writeText(msgs[pcMsgTab].text).then(()=>{ const btn=document.querySelector('.msg-copy-btn'); btn.textContent='복사됨!'; setTimeout(()=>btn.textContent='문자 복사',2000); });
}

// ── 시작 ──
init();
</script>
